name: Daily Market Brief

on:
  schedule:
    - cron: '0 12 * * 1-5'  # 7am ET (EST) Mon–Fri
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  generate-brief:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate brief
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY }}
        run: node scripts/generate-brief.js

      - name: Commit and push brief.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/brief.json
          git diff --staged --quiet || git commit -m "brief: $(date -u +%Y-%m-%d)"
          git push
