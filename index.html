    {tab==='equities'&&<>
      <Card accent={C.green}><PE col={C.green}>A stock = ownership in a company. When you buy a share of Apple, you own a tiny piece of Apple — its profits, its assets, its future. The price reflects what all investors collectively think the company will earn in the future, discounted back to today.</PE><TE>Equity is a residual claim on assets and earnings after all debt obligations. Equity holders bear the most risk (last to be paid in bankruptcy) but capture upside. Price = sum of expected future free cash flows discounted at WACC. Equity risk premium (ERP) = expected equity return minus risk-free rate ≈ 4–6% historically.</TE></Card>
      <Sub>Valuation Metrics — How to Tell If a Stock Is Cheap or Expensive</Sub>
      {[{m:'P/E — Price-to-Earnings',f:'Stock Price ÷ Earnings Per Share',col:C.green,plain:'The most basic valuation metric. If a stock costs $100 and earns $5/year, P/E = 20x. You\'re paying $20 for every $1 of annual earnings. The S&P 500 historically trades at ~16–18x earnings. Above that = expensive (market is paying for future growth). Below = cheaper. The critical question: which DIRECTION are earnings estimates moving?',tech:'P/E = Price/EPS. LTM (last twelve months) vs. NTM (next twelve months = forward P/E). P/E is the denominator of what you\'re paying for profitability. Multiple expansion (P/E rises without earnings rising) = sentiment/valuation-driven returns. Compression (P/E falls) = earnings growing but price stagnant or falling. Rising discount rates compress P/E (especially for high-multiple growth names).'},
      {m:'Forward P/E',f:'Stock Price ÷ Next 12-Month EPS Estimate',col:C.cyan,plain:'Because markets trade on what\'s going to happen, not what already happened, investors use forward P/E more than trailing P/E. A stock with forward P/E of 30x is expensive — you\'re paying $30 for every $1 of expected earnings over the next year. But that might be worth it if those earnings are growing fast.',tech:'Forward P/E = Price / NTM consensus EPS estimate. More forward-looking but subject to estimate revision risk. Earnings revision direction (are analysts raising or lowering estimates?) is critical — stocks tend to rise even on flat prices if earnings estimates are being upgraded. EPS surprises and guidance are the two primary catalysts for forward P/E re-rating.'},
      {m:'EV/EBITDA',f:'Enterprise Value ÷ EBITDA',col:C.accent,plain:'Enterprise Value = market cap + all debt - cash. EBITDA = earnings before interest, taxes, depreciation, and amortization (a rough proxy for cash profit). This metric is better than P/E for comparing companies with different amounts of debt. It answers: how much are you paying for the whole business, independent of how it\'s financed?',tech:'EV/EBITDA is capital structure-neutral (works across different leverage levels). EV = Market Cap + Net Debt. EBITDA ≈ operating cash generation before capex. Industry-specific comps: tech ~20–30x, industrials ~10–15x, utilities ~12–16x. Used in LBO and M&A analysis because it\'s the metric acquirers pay on. EBITDA – Capex = EBIT proxy for capital-intensive businesses.'},
      {m:'PEG — Price/Earnings to Growth',f:'Forward P/E ÷ EPS Growth Rate',col:C.purple,plain:'P/E alone doesn\'t tell you if paying 30x is worth it — it depends on how fast earnings are growing. PEG adjusts for growth. PEG < 1 = potentially cheap relative to growth. PEG = 1 = fairly valued. PEG > 2 = expensive relative to growth rate. Used most often for high-growth tech companies.',tech:'PEG ratio adjusts for growth rate in EPS. Developed by Peter Lynch. For a stock trading at 30x earnings growing at 30%/yr, PEG = 1.0 = theoretically fairly valued. Limitation: assumes linear relationship between P/E and growth, ignores terminal value and duration of growth. Better than raw P/E for comparing companies with very different growth trajectories (AI capex beneficiaries vs. mature industrials).'},
      ].map(v=>(<Card key={v.m}><div style={{display:'flex',gap:10,alignItems:'baseline',marginBottom:8}}><span style={{fontSize:13,fontWeight:700,color:C.text}}>{v.m}</span><code style={{fontSize:11,color:v.col,background:`${v.col}15`,padding:'1px 7px',borderRadius:3}}>{v.f}</code></div><PE col={v.col}>{v.plain}</PE><TE>{v.tech}</TE></Card>))}
      <Sub>Earnings — The Most Important Quarterly Event</Sub>
      <Card accent={C.amber}><PE col={C.amber}><strong>How earnings work:</strong> Every quarter, companies report how much they made (EPS) and how much they sold (revenue). The stock doesn't move on the number itself — it moves on how the number compares to what analysts expected. Beat the expectations = stock goes up. Miss = goes down. And the guidance for next quarter matters even more than the current result.</PE><TE>Earnings trades are about the <em>surprise</em>: (actual EPS - consensus EPS) / stock price × implied move from options = the "earnings whisper." Options price in expected move — S&P 500 stocks average ~4–5% move on earnings. The critical variable: earnings revision direction post-report. A beat followed by guidance cut = stock down. Revenue beat with margin compression = mixed. FCF beat with capex investment signal = long-term positive even if EPS misses.</TE>
      <div style={{marginTop:12}}>{[['EPS Beat','Reported earnings > what analysts expected. Basic positive signal.','EPS surprise = (actual - estimate) / |estimate|. +10% EPS surprise = strong beat. Market typically prices 1-day move of ~2–3% for S&P 500 component on beat.'],['Beat & Raise','Beat current quarter AND raised full-year guidance. The bullish trifecta.','Most bullish outcome: current beat (backward-looking positive) + raised guidance (forward-looking positive). Triggers estimate upgrades across sell-side → earnings revision momentum → sustained multiple expansion.'],['Revenue Beat','Sales growth > expected. Higher quality than EPS beat alone.','Revenue is harder to manipulate than EPS. Revenue miss even with EPS beat = quality concern (cut costs to meet EPS). Revenue + EPS beat = fundamental strength. Revenue acceleration is the cleanest signal.'],['Guidance Cut','Company lowers full-year or next-quarter forecast. Most damaging outcome.','Guidance cut = management saying "we were wrong about our own business." Triggers estimate cuts across sell-side → multiple compression → potential de-rating. Often 10–20%+ stock declines. Look for: macro headwinds, pricing power loss, input cost pressure, or competitive dynamics.'],].map(([t,plain,tech])=>(<div key={t} style={{marginBottom:10}}><div style={{fontSize:12,fontWeight:700,color:C.amber,marginBottom:4}}>{t}</div><PE col={C.amber}>{plain}</PE><TE>{tech}</TE></div>))}</div></Card>
      <Sub>GICS Sectors — The 11 Buckets</Sub>
      <Card accent={C.dim}><P>The S&P 500 is divided into 11 sectors. <strong style={{color:C.text}}>Cyclical</strong> sectors (tech, consumer disc, industrials) move with the economy. <strong style={{color:C.text}}>Defensive</strong> sectors (staples, utilities, healthcare) are stable regardless of the economy. Sector rotation — moving between these — is a core part of portfolio management.</P></Card>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:7,marginBottom:8}}>{[['Technology','Growth/Cyclical',C.accent,'Largest S&P sector (~28%). Long-duration — most sensitive to rate increases. AI supercycle driving massive capex.','Rate rises compress tech multiples hardest (long-duration DCF). But AI secular tailwind overrides in 2024–2026.'],['Financials','Cyclical',C.green,'Banks, asset managers, insurance. Benefits from rising rates (wider NIM) and steeper yield curve.','NIM (Net Interest Margin) = spread between lending rates and deposit costs. Steeper curve = better for banks. Credit losses rise in contraction = headwind.'],['Healthcare','Defensive',C.cyan,'Non-cyclical earnings — people need drugs regardless of economy. Patent cliff risk, drug pricing politics.','Defensive beta < 1. Earnings driven by drug patent expiries, FDA approvals, M&A (bolt-ons). Political risk = drug price negotiation (IRA).'],['Consumer Disc.','Cyclical',C.amber,'High beta to consumer confidence. Amazon, Tesla, LVMH, Nike. Suffers when wallets tighten.','Beta to consumer sentiment and real income. Interest rate sensitive (auto loans, mortgages). Most exposed to tariff/supply chain risk.'],['Consumer Staples','Defensive',C.green,'Coke, P&G, Walmart. People buy toothpaste regardless. Outperforms in downturns. Boring but safe.','Inelastic demand, pricing power (brand), stable FCF. Underperforms in risk-on (boring vs. growth). Defensive rotation target in contraction.'],['Energy','Commodity',C.amber,'Trades with WTI/Brent oil price. Currently benefiting from $100+ oil on Strait of Hormuz closure.','High operating leverage to oil price. FCF generation at $100+ oil = massive. Capex discipline (2020 lesson) = more shareholder returns. ESG headwinds on institutional ownership.'],['Industrials','Cyclical',C.muted,'Aerospace, defense, transportation, equipment. Benefits from AI data center buildout and defense spending.','Capex cycle play. Defense: earnings driven by government budget. Transport: economic activity proxy. Most global supply chain exposed.'],['Comm. Services','Mixed',C.purple,'Meta, Alphabet, Netflix, T-Mobile. Mix of growth (digital ads) and stable (telecom).','Digital advertising is cyclical — cuts in recession. Streaming secular but competitive. Meta/Alphabet = AI infrastructure spend is both capex headwind and moat builder.'],['Real Estate (REITs)','Rate-sensitive',C.red,'Hurt by rising rates — REITs borrow to buy property, and rising rates increase their cost and compress valuations.','REITs are bond proxies. Cap rate compression (when rates fall, property values rise; when rates rise, they fall). FFO (Funds From Operations) = REIT earnings equivalent. Office REITs in structural secular decline (WFH).'],['Utilities','Defensive',C.muted,'Bond proxy — moves inversely to rates. Outperforms when rates fall. Boring but now interesting for AI power demand.','Regulated ROE (Return on Equity) — utility profitability is capped by regulation. Dividend yield play. AI data center power demand thesis is driving re-rating in 2025–2026.'],['Materials','Cyclical',C.cyan,'Mining, chemicals, fertilizers. Trades on China demand signals and commodity prices.','China is 50%+ of global demand for many base metals. Dr. Copper as economic barometer. Energy transition (EVs, renewables) secular driver for copper, lithium, rare earths.'],].map(([s,cycle,col,plain,tech])=>(<div key={s} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:5,padding:'9px 10px'}}><div style={{fontSize:12,fontWeight:700,color:C.text,marginBottom:4}}>{s}</div><Tag color={col}>{cycle}</Tag><div style={{fontSize:11,color:C.text,marginTop:6,lineHeight:1.4}}>{plain}</div><div style={{fontSize:10,color:C.muted,marginTop:4,lineHeight:1.4}}>{tech}</div></div>))}</div>
    </>}
    {tab==='fixed'&&<>
      <Card accent={C.accent}><PE col={C.accent}><strong>What is fixed income?</strong> When a government or company needs to borrow money, instead of going to a bank, they can issue bonds — essentially IOUs sold to thousands of investors. The investor lends the money, receives regular interest payments (the "coupon"), and gets their money back at the end (maturity). Called "fixed income" because the payments are fixed upfront.</PE><TE>A bond is a debt instrument with defined cash flows: periodic coupon payments (C) and par value (F) at maturity (T). Bond price = PV(coupons) + PV(face value). Discounted at YTM (yield to maturity) = implied discount rate. Global fixed income market ≈ $130T — larger than global equities. US Treasuries ($27T outstanding) are the risk-free benchmark.</TE></Card>
      <Sub>The Most Critical Mechanic — Price vs. Yield</Sub>
      <Card accent={C.red}><PE col={C.red}><strong>This is the most counterintuitive thing in finance — learn it cold.</strong> Bond prices and yields move in OPPOSITE directions. If a bond pays $50/year and you paid $1,000 (5% yield), then new bonds start paying $60/year (6%), your $50 bond is now less attractive — so its price falls until the $50 payment represents a 6% yield on the new lower price ($833). That's the mechanical relationship.</PE><TE>P = C/(1+y) + C/(1+y)² + ... + (C+F)/(1+y)^T. As y (yield) rises, denominator increases → P falls. The relationship is convex, not linear. This is why: bond price = PV of all future cash flows discounted at current yield. New issuance sets market clearing yield → existing bonds re-price to match. The price-yield inverse relationship is the single most important mechanic in fixed income.</TE></Card>
      <Sub>Key Concepts</Sub>
      {[['Duration','How much does a bond\'s price change when yields change? A bond with duration = 8 years will fall about 8% in price if yields rise by 1% (100bps). Longer maturity = higher duration = more sensitive to rate moves.','Modified Duration measures price sensitivity to yield changes: ΔP/P ≈ -Modified Duration × Δy. A 10Y Treasury has modified duration ~9yr. A 30Y Treasury ~18yr. 2Y Treasury ~1.8yr. This is why 30Y bonds are destroyed in rate hike cycles and why 2Y bonds are mostly stable. Duration = years of cash flows weighted by PV.'],
      ['DV01 — Dollar Value of 01','How much money do you make or lose if yields move by just 1 basis point (0.01%)? This is how traders size positions and manage risk. A $100M Treasury portfolio with DV01 = $90k means every 1bp move = $90,000 profit or loss.','DV01 = -Modified Duration × Price × Face Value × 0.0001. For a $100M position in 10Y Treasuries (Duration 9yr, price ~100): DV01 = 9 × 100 × $100M × 0.0001 = $90,000/bp. Traders hedge portfolios by matching DV01: long $100M 10Y UST, short equivalent DV01 in 10Y Treasury futures.'],
      ['YTM — Yield to Maturity','The total annual return you\'d earn if you bought the bond today and held it until it matures, assuming all coupon payments are reinvested. It\'s the number traders quote when discussing bonds — "the 10Y is at 4.5%" means the 10Y Treasury currently yields 4.5% per year to maturity.','YTM is the internal rate of return (IRR) of the bond\'s cash flows at the current price. It incorporates coupon reinvestment assumption. YTM > coupon rate → bond trading at discount (below par). YTM < coupon rate → bond at premium. YTM is the single quoted metric in rates markets — Bloomberg, FRED, newspapers all quote yields not prices.'],
      ['Convexity','An additional adjustment to duration — duration overstates how much price falls when yields rise, and understates how much price rises when yields fall. Convexity is the "cushion" that makes bonds a slightly better hedge than their duration alone suggests.','Convexity = d²P/dy² / P. Long bonds have more convexity than short bonds. Positive convexity means: for a given yield move, prices rise more than they fall. Options-embedded bonds (callable bonds, MBS) can have negative convexity — they shorten duration when rates fall (bad). Convexity is most important for large yield moves (>50bps).'],
      ].map(([t,plain,tech])=>(<Card key={t}><div style={{fontSize:13,fontWeight:700,color:C.cyan,marginBottom:8}}>{t}</div><PE col={C.cyan}>{plain}</PE><TE>{tech}</TE></Card>))}
      <Card accent={C.red}><div style={{fontSize:13,fontWeight:700,color:C.red,marginBottom:8}}>Why 2022 Was Catastrophic — The Duration Lesson</div><PE col={C.red}>The Fed raised rates by 4.25% in one year. Any bond with 10+ year maturity lost 30–60% of its value. A 30-year bond lost ~40%. Pension funds, insurance companies, and SVB — all holding long-duration bonds — were devastated. SVB failed in March 2023 partly because of this. The lesson: <strong>duration is risk</strong>, not just return.</PE><TE>4.25% × 9yr (10Y duration) = ~38% price impact on 10Y Treasuries. 4.25% × 18yr (30Y duration) = ~77% price impact on 30Y bonds. Bloomberg Barclays US Agg down 13.01% in 2022 = worst year since 1970s. SVB: held $91B in long-dated securities at cost basis; unrealized losses exceeded equity capital when rates rose → bank run → failure. Duration is a risk factor as real as credit risk.</TE></Card>
      <Sub>Credit — Lending to Companies, Not Just Governments</Sub>
      {[[C.green,'Investment Grade (IG)','These are bonds issued by financially strong, stable companies — companies that rating agencies (S&P, Moody\'s) trust to pay back their debt. Think Apple, Microsoft, Johnson & Johnson. Lower risk, lower return.','Rating: BBB-/Baa3 and above (S&P/Moody\'s). Spread over equivalent Treasury = OAS (Option-Adjusted Spread). IG spreads: historically 80–120bps, currently ~100bps. IG buyers: insurance companies (liability-matching), pension funds (liability-driven investment). IG primary market = new bond issuance. Size: ~$10T USD market.'],
      [C.amber,'High Yield (HY) — "Junk Bonds"','These are bonds from companies that aren\'t financially strong enough to get IG ratings — maybe they have too much debt, or their business is risky, or they\'re growing fast but not yet profitable. Because investors are taking more risk (the company might default), they demand higher interest rates ("yield"). HY spreads: how much extra yield vs. safe Treasuries.','Rating: BB+/Ba1 and below. HY spreads: 300–500bps normal, 150bps compressed (risk-on), 800bps+ in crisis. HY is equity-like in risk-off — trades more on credit fundamentals than rates. The key HY indicator: CDX.NA.HY (credit default swap index on 100 HY companies). HY spread widening = risk-off signal. Size: ~$1.5T USD market. Default rates: <2% in benign, 10%+ in recession.'],
      [C.red,'Credit Default Swaps (CDS)','An insurance policy on a bond. The buyer pays a premium (the CDS spread) and receives a payout if the bond defaults. If you\'re nervous a company might not pay back its debt, you buy CDS protection. Traders use CDS to hedge or speculate on corporate credit risk.','CDS is a bilateral OTC derivative. Notional = face value of the bond. Seller receives coupon (spread), buyer receives par - recovery if credit event. CDX = index of CDS on multiple names (CDX.NA.IG = 125 IG names, CDX.NA.HY = 100 HY names). Single-name CDS on specific companies. CDS spread = market-implied default probability × (1 - recovery rate). CDS market ~$8T notional.'],
      ].map(([col,title,plain,tech])=>(<Card key={title} accent={col}><div style={{fontSize:13,fontWeight:700,color:col,marginBottom:8}}>{title}</div><PE col={col}>{plain}</PE><TE>{tech}</TE></Card>))}
    </>}
    {tab==='fx'&&<>
      <Card accent={C.purple}><PE col={C.purple}><strong>What is FX?</strong> Every time a US company does business in Europe, or a Japanese company buys American goods, currencies have to be exchanged. The FX market is where this happens — it's the largest financial market in the world ($7.5T traded every day). The price of one currency relative to another is called the "exchange rate."</PE><TE>FX is a global 24-hour OTC market. Traded in pairs (EUR/USD = price of 1 Euro in dollars). G10 FX (USD, EUR, JPY, GBP, CHF, CAD, AUD, NZD, SEK, NOK) = most liquid. EM FX = higher yield, higher risk. Spot market ($T/day) + derivatives (forwards, swaps, options). BIS Triennial Survey: $7.5T/day turnover (2022), mostly FX swaps. Largest participants: banks (Citi, JPM, Deutsche) as market-makers.</TE></Card>
      <Sub>FX Concepts</Sub>
      {[['Spot Rate','The current exchange rate for immediate delivery. If EUR/USD = 1.08, it costs $1.08 to buy 1 Euro right now. Spot trades settle "T+2" — two business days after the deal.','EUR/USD spot = price in USD of 1 EUR. Convention: base/quote. EUR = base currency, USD = quote currency. Spot settlement: T+2 business days (T+0 for some emerging markets). Spot market driven by: interest rate differentials, current account flows, sentiment, central bank intervention, positioning. EURUSD is the most-traded currency pair (~24% of all FX volume).'],
      ['Forward Rate','A deal to exchange currencies at a specific rate on a specific future date — agreed today. Companies use forwards to "lock in" an exchange rate so they know exactly what their foreign earnings will be worth in dollars, regardless of what the market does.','Forward rate = Spot × [(1 + domestic rate × days/360) / (1 + foreign rate × days/360)]. Forward is determined by Interest Rate Parity (IRP) — arbitrage keeps forwards in line with interest differentials. Forward points = forward minus spot (in pips). Corporate hedging use case: US company with EUR revenues sells EUR forward to lock in USD revenue.'],
      ['The Carry Trade','Borrow money in a country with very low interest rates (historically Japan — 0%). Convert to a high-rate currency (Brazil, Turkey, Australia) and invest. The profit = the interest rate difference. Big, popular, very profitable in calm markets. But when markets get scared (risk-off), everyone exits at once and the high-rate currencies crash — this is the carry "unwind."','Carry trade: long high-yielder, short low-yielder. Expected P&L ≈ interest rate differential. Risk: currency of high-yield country depreciates (UIP). In practice, UIP fails in the short run → carry works during risk-on. Unwind risk: when risk-off hits, all carry longs sold simultaneously. Aug 2024 JPY carry unwind: USDJPY fell 12% in 3 weeks as JPY shorts covered. Carry often described as "picking up nickels in front of a steamroller."'],
      ['DXY — The US Dollar Index','A single number that measures the US Dollar\'s strength against a basket of 6 major currencies. The basket is weighted heavily toward the Euro (57.6%). DXY up = dollar getting stronger. DXY down = dollar weakening. The USD is the most important currency in the world because nearly everything — oil, gold, international trade — is priced in dollars.','DXY weights: EUR 57.6%, JPY 13.6%, GBP 11.9%, CAD 9.1%, SEK 4.2%, CHF 3.6%. Because EUR is 57.6%, DXY ≈ inverse of EUR/USD. DXY is a tradeable index (futures on ICE). A stronger dollar = tighter financial conditions globally (most EM debt is USD-denominated). Fed hikes → DXY rises → EM stress → global tightening spillover.'],
      ['EUR/USD vs. DXY','In your hub, we track EUR/USD as a proxy for DXY. They move opposite: EUR/USD up = Euro getting stronger = Dollar weaker = DXY falling. EUR/USD down = Euro weaker = Dollar stronger = DXY rising.','EUR/USD and DXY have correlation ~-0.92 due to EUR\'s 57.6% weight in DXY. EUR/USD "4. close" from Alpha Vantage API → if EUR/USD rises, DXY falls, so `up: cur < prev` for DXY. The proxy isn\'t perfect (misses JPY/GBP/CAD moves) but captures the primary driver.'],
      ].map(i=>(<Card key={i[0]}><div style={{fontSize:13,fontWeight:700,color:C.cyan,marginBottom:8}}>{i[0]}</div><PE col={C.cyan}>{i[1]}</PE><TE>{i[2]}</TE></Card>))}
      <Sub>Commodities</Sub>
      {[{n:'WTI / Brent — Oil',tag:'Energy',col:C.amber,plain:'WTI (West Texas Intermediate) and Brent are the two main oil price benchmarks. Oil is the most geopolitically important commodity — it powers transportation, petrochemicals, heating. Currently $100+ because Iran partially blocked the Strait of Hormuz, through which 20% of the world\'s oil flows. Higher oil = higher inflation (directly through gas, indirectly through everything that ships).',tech:'WTI = US oil benchmark, traded on NYMEX. Brent = global oil benchmark (North Sea). Brent typically trades at $2–5 premium to WTI. Oil demand: global ~100M barrels/day. Supply: OPEC+ (Saudi + Russia), US shale. Price elasticity: short-run inelastic (demand doesn\'t fall immediately). 2026 catalyst: Strait of Hormuz partial closure = supply shock → oil >$100 → CPI impact 30–50bps. At $100/bbl, US gasoline ~$4/gal.'},
      {n:'Gold',tag:'Safe Haven / Real Asset',col:C.amber,plain:'Gold is a 5,000-year-old form of money that central banks and investors hold as a "store of value." It pays no dividends or interest, which makes it unattractive when interest rates are high (why earn 0% on gold when Treasuries pay 5%?). But when people are scared of inflation, currency collapse, or geopolitical catastrophe, they run to gold.',tech:'Gold price driven by: (1) real rates (inverse relationship — gold is best when TIPS yields are negative), (2) USD strength (inverse), (3) central bank buying (China, India, Russia buying aggressively), (4) geopolitical risk premium. Gold doesn\'t carry (no yield) → opportunity cost = real rate. When 10Y TIPS yield < 0, gold has no competition from risk-free assets. Also: gold futures (COMEX), GLD ETF ($55B AUM).'},
      {n:'Copper',tag:'Economic Barometer',col:C.cyan,plain:'"Dr. Copper" — copper is used in everything: electrical wiring, construction, electronics, electric vehicles. So its price tends to predict economic activity — rising copper = growing global economy. Falling copper = slowdown. China consumes 50% of global copper, so Chinese growth data massively impacts copper prices.',tech:'Copper demand breakdown: construction (~40%), electronics (~25%), transport (~15%). China = 55% global demand. LME (London Metal Exchange) is primary trading venue. Inventories (reported by LME, SHFE, CME) are leading demand indicator. EV transition secular driver: an EV uses ~83kg of copper vs. ~23kg for ICE vehicle → EV adoption = long-term copper demand spike. Currently: supply disruptions (Chile, Peru weather) + Chinese reopening demand = bullish.'},
      ].map(c=>(<Card key={c.n} accent={c.col}><div style={{display:'flex',gap:8,marginBottom:8}}><span style={{fontSize:13,fontWeight:700,color:C.text}}>{c.n}</span><Tag color={c.col}>{c.tag}</Tag></div><PE col={c.col}>{c.plain}</PE><TE>{c.tech}</TE></Card>))}
    </>}
    {tab==='alts'&&<>
      <Card accent={C.purple}><P><strong style={{color:C.text}}>Why do you need to know alternatives?</strong> Your institutional clients — pension funds, endowments, insurance companies, sovereign wealth funds — put 20–40% of their portfolios into "alternatives" (PE, hedge funds, private credit, real assets). To have credible conversations with these PMs, you need to understand their world.</P></Card>
      <Sub>Private Equity (PE)</Sub>
      {[['LBO — Leveraged Buyout','A PE firm buys a company using a small amount of their own money and a large amount of borrowed money (debt). Like buying a house with a 20% down payment and 80% mortgage — except the "house" is a company, and the company\'s cash flows have to pay the mortgage.','LBO is the canonical PE deal. Typical structure: 30–40% equity (PE fund money), 60–70% debt (loans + high yield bonds). Returns driven by: (1) earnings growth (EBITDA expansion), (2) de-leveraging (debt paydown with FCF), (3) multiple expansion (buying at 10x, selling at 12x EBITDA). Current challenge: 3.75–4.00% FFR means debt is expensive → fewer deals close → PE activity slowed 60%+ from 2021 peak.'],
      ['IRR and MOIC','IRR = Internal Rate of Return = the annualized return on the investment. MOIC = Multiple On Invested Capital = how many times you got your money back. 3x MOIC means you turned $1 into $3. 25% IRR means you earned 25% per year. PE funds target 20%+ IRR and 3x+ MOIC.','IRR = discount rate that makes NPV of cash flows = 0. MOIC = total proceeds / total invested. Example: invest $100M in 2020, exit for $320M in 2025 (5 years) = 3.2x MOIC = 26% IRR. Note: IRR and MOIC can diverge based on timing — a 2x in 1 year (100% IRR) >> a 2x in 10 years (7% IRR). Top-quartile PE targets: 25%+ IRR, 3x+ MOIC. Current vintage (2022–2023 deals): challenged by higher entry multiples and expensive debt.'],
      ['J-Curve','PE fund returns look terrible in the first few years — management fees are eating into capital while the portfolio is still being built. Then as companies are sold (exits), returns spike upward. The shape looks like a "J" when you graph it over time.','J-curve: early negative returns from management fees (1.5–2% of committed capital) and deployment lag, then positive returns as investments are exited (IPOs, M&A, secondaries). Typical PE fund life: 10 years (5yr investment period, 5yr harvest). IRR typically turns positive in year 3–4. DPI (Distributed to Paid-In) = cash returned ÷ cash invested. RVPI (Residual Value to Paid-In) = unrealized value ÷ invested. TVPI = DPI + RVPI.'],
      ].map(([t,plain,tech])=>(<Card key={t} accent={C.purple}><div style={{fontSize:13,fontWeight:700,color:C.purple,marginBottom:8}}>{t}</div><PE col={C.purple}>{plain}</PE><TE>{tech}</TE></Card>))}
      <Sub>Private Credit — The Fastest-Growing Asset Class</Sub>
      <Card accent={C.accent}><PE col={C.accent}><strong>What is private credit?</strong> Instead of borrowing from banks or issuing bonds in public markets, mid-sized companies borrow directly from private funds. Why do companies do this? It's faster, more flexible, and doesn't require as much disclosure. Why do investors like it? Higher yields than public bonds (because it's illiquid) and floating rates (the interest rate adjusts with market rates — good in a rising rate environment like 2022–2026).</PE><TE>Private credit AUM: ~$1.7T globally, ~40% CAGR since 2010. Predominant structure: floating rate (SOFR+500–700bps = ~10–11% all-in yield at current SOFR). Senior secured position in capital structure (first claim on assets in default). Key documents: credit agreement, security agreement. Risk: illiquidity premium (no secondary market), higher default risk than IG public, lender-on-lender competition reducing protections. Major managers: Ares, Blackstone, Blue Owl, Apollo.</TE>
      <div style={{marginTop:12}}>{[['Direct Lending','A private credit fund lends directly to a mid-sized company — bypassing banks entirely. The fund earns interest (typically 10–12% all-in today) and gets repaid when the company sells or refinances.','Senior secured term loans to middle market companies ($10M–$500M EBITDA). Floating rate: SOFR + 500–700bps spread = ~10–12% all-in yield. Documentation: first lien, security interest on all assets, covenants (leverage ratio, interest coverage). OID (Original Issue Discount) adds additional yield. Default rate: historically ~1–2% vs. HY bonds ~3–4% (more negotiating leverage).'],
      ['CLO — Collateralized Loan Obligation','A CLO is a financial structure that pools together hundreds of corporate loans and then issues different "slices" (tranches) of that pool to investors. Safer slices get paid first, riskier slices get higher interest. CLOs are the biggest buyer of leveraged loans (corporate loans below investment grade).','CLO structure: SPV (Special Purpose Vehicle) issues 5–7 tranches rated AAA to equity. AAA tranche = safest, ~5–6% yield. BB tranche = higher risk, ~10–12%. Equity tranche = unrated, 15–20%+ targeted. The CLO manager actively trades the loan portfolio. CLO equity is the first-loss piece but gets all residual cash after all debt tranches paid. Market: ~$1T outstanding. Primary demand driver for leveraged loans market.'],
      ['Mezzanine','A middle layer of debt that sits between senior debt (gets paid first) and equity (gets paid last). Mezzanine lenders take more risk than senior lenders but less than equity holders — they get higher interest rates plus often an "equity kicker" (warrants that can be converted to equity if the company does well).','Mezzanine = subordinated debt + equity upside via warrants or PIK (Payment In Kind). Coupon: cash + PIK = total 14–18% typical. Sits below senior secured in capital structure → higher loss severity in default. Used in LBOs to bridge the gap between senior debt capacity and equity investment. Equity kicker: aligned with management to drive value creation. Limited partners in mez funds: endowments, insurance, family offices seeking yield premium.'],
      ].map(([t,plain,tech])=>(<div key={t} style={{marginBottom:12}}><div style={{fontSize:12,fontWeight:700,color:C.accent,marginBottom:4,paddingLeft:12,borderLeft:`2px solid ${C.accent}44`}}>{t}</div><PE col={C.accent}>{plain}</PE><TE>{tech}</TE></div>))}</div></Card>
    </>}
  </div>;
}

function GlossarySection(){
  const[q,setQ]=useState('');
  const terms=[
    {cat:'Rates',term:'Basis Point (bps)',def:"1/100th of 1%. 25bps = 0.25%."},
    {cat:'Rates',term:'SOFR',def:'Replaced LIBOR. US benchmark floating rate.'},
    {cat:'Rates',term:'Real Rate',def:'Nominal rate minus inflation. Drives gold and currencies.'},
    {cat:'Rates',term:'Breakeven Inflation',def:'10Y nominal minus 10Y TIPS yield = market\'s 10yr inflation expectation.'},
    {cat:'Rates',term:'TIPS',def:'Treasury Inflation-Protected Securities. Principal adjusts with CPI.'},
    {cat:'Rates',term:'Repo',def:'Short-term borrowing using securities as collateral. Critical for bank funding.'},
    {cat:'Equities',term:'Beta',def:'Sensitivity to market moves. Beta > 1 = more volatile. Defensives < 1.'},
    {cat:'Equities',term:'Alpha',def:'Excess return over benchmark after risk adjustment.'},
    {cat:'Equities',term:'Sharpe Ratio',def:'(Return - Risk-free rate) / Volatility. Higher = better risk-adjusted return.'},
    {cat:'Equities',term:'Short Selling',def:'Borrow and sell, betting price falls, buy back to close.'},
    {cat:'Equities',term:'VWAP',def:'Volume Weighted Average Price. Benchmark for execution quality.'},
    {cat:'Credit',term:'IG Cliff (BBB-)',def:'Investment grade / high yield threshold. Fallen angels force selling.'},
    {cat:'Credit',term:'Fallen Angel',def:'Was IG, downgraded to HY. Creates forced selling — often a buying opportunity.'},
    {cat:'Credit',term:'Covenant',def:'Legal restrictions in a loan/bond. Cov-lite = more risk to lenders.'},
    {cat:'Credit',term:'Recovery Rate',def:'How much creditors recover in default. Senior ~60–70%, HY unsecured ~30–40%.'},
    {cat:'Credit',term:'CDS',def:'Credit Default Swap. Insurance against default. Spreads = real-time credit health.'},
    {cat:'Macro',term:'PMI',def:'Purchasing Managers\' Index. 50 = expansion/contraction line.'},
    {cat:'Macro',term:'Stagflation',def:'High inflation + stagnant growth. 2026 has "stagflation-lite" characteristics.'},
    {cat:'Macro',term:'Soft Landing',def:'CB raises rates to kill inflation without recession. 2024 US outcome.'},
    {cat:'Macro',term:'Fiscal Policy',def:'Government spending and taxation. Congress/Treasury. Separate from the Fed.'},
    {cat:'Macro',term:'QE / QT',def:'Quantitative Easing (balance sheet expansion) / Tightening (contraction).'},
    {cat:'FX',term:'DXY',def:'Dollar Index: EUR 57.6%, JPY 13.6%, GBP 11.9%, CAD 9.1%, SEK 4.2%, CHF 3.6%.'},
    {cat:'FX',term:'Carry Trade',def:'Borrow in low-rate currency, invest in high-rate. Unwinds violently in risk-off.'},
    {cat:'FX',term:'Intervention',def:"Central bank buys/sells its own currency to influence the exchange rate."},
    {cat:'Derivatives',term:'Call / Put',def:'Call = right to buy at strike. Put = right to sell. Buyer pays premium.'},
    {cat:'Derivatives',term:'Delta',def:'Option price change per $1 move in underlying. 0–1 calls, 0 to -1 puts.'},
    {cat:'Derivatives',term:'Implied Vol (IV)',def:"Market's forecast of future vol from option prices. VIX is S&P 500's 30-day IV."},
    {cat:'Derivatives',term:'VIX',def:'Fear index. Below 15 = calm. Above 30 = fear. Spiked >80 in COVID.'},
    {cat:'Derivatives',term:'Swap',def:'Exchange of cash flows. Interest rate swap: fixed for floating.'},
    {cat:'Market Structure',term:'Market Maker',def:'Quotes both bid and ask, providing liquidity. What S&T desks do.'},
    {cat:'Market Structure',term:'Block Trade',def:'Large institutional trade (>$5M+) executed to minimize market impact.'},
    {cat:'Market Structure',term:'Dark Pool',def:'Private exchange for large anonymous orders.'},
  ];
  const filtered=useMemo(()=>{if(!q)return terms;const lq=q.toLowerCase();return terms.filter(t=>t.term.toLowerCase().includes(lq)||t.def.toLowerCase().includes(lq)||t.cat.toLowerCase().includes(lq));},[q]);
  const cats=[...new Set(filtered.map(t=>t.cat))];
  return <div>
    <SH>Technical Glossary</SH>
    <p style={{fontSize:13,color:C.muted,marginBottom:16}}>{terms.length} terms — search anything</p>
    <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search: 'duration', 'credit', 'carry'…" style={{width:'100%',maxWidth:440,background:C.card,border:`1px solid ${C.border}`,borderRadius:6,padding:'9px 14px',color:C.text,fontSize:13,outline:'none',marginBottom:20,boxSizing:'border-box'}}/>
    {cats.map(cat=><div key={cat}><Sub>{cat}</Sub><Grid>{filtered.filter(t=>t.cat===cat).map(t=>(<Card key={t.term}><div style={{fontSize:13,fontWeight:600,color:C.cyan,marginBottom:4}}>{t.term}</div><div style={{fontSize:12,color:C.muted,lineHeight:1.5}}>{t.def}</div></Card>))}</Grid></div>)}
    {!filtered.length&&<div style={{color:C.muted,fontSize:13,padding:20}}>No terms found.</div>}
  </div>;
}

function InterviewSection(){
  const[open,setOpen]=useState(null);
  const qas=[
    {q:'Walk me through what happened to the bond market in 2022.',cat:'Rates',a:'The Fed hiked 425bps in one year — fastest since Volcker. Bond prices move inversely to yields. Long-duration bonds (~17yr duration) × 4% yield rise = ~68% price impact from duration alone. Worst year for bonds in 100+ years. The lesson: duration is risk.'},
    {q:'If the Fed hikes 100bps, what happens to bonds and equities?',cat:'Cross-Asset',a:'Bonds: price falls. A 10Y Treasury (~9yr duration) loses ~9%. Long bonds hurt far more. Equities: rising discount rates hurt growth stocks most (long-duration). Defensives (utilities, REITs) also hurt — bond proxies. Banks can benefit from steeper curve (NIM). Net: equities usually sell off, growth more than value.'},
    {q:'What is the yield curve telling us right now?',cat:'Current Macro',a:'Currently bear-steepening — long end rising faster as inflation concerns mount. Warsh hiked in September 2026, markets pricing Oct and Dec. Oil $100+ from Middle East feeding into PCE (3.3%). No longer inverted like 2022–2023, but steepening reflects inflation premium priced back into long bonds.'},
    {q:'Pitch me a trade you\'d put on today.',cat:'Trade Idea',a:'Framework: thesis, instrument, catalyst, risk. Example: "I\'d buy 2-year Treasuries and short 10-year — a flattener trade. Thesis: Warsh is anchoring the short end by hiking, but the long end has priced in too much inflation premium. Catalyst: if next CPI comes in below expectations, long end rallies while short stays anchored. Risk: oil continues rising, trade doesn\'t work."'},
    {q:'Why do bond prices fall when yields rise?',cat:'Rates Basics',a:'A bond promises $50/year on $1,000 par — that\'s 5%. If new bonds offer 6%, your 5% bond is less attractive. The price must fall until the fixed $50 coupon represents a 6% return on the new lower price. Inverse relationship — mechanical and fundamental.'},
    {q:'Walk me through how equities are valued.',cat:'Equities',a:'Core metrics: P/E (how much per dollar of earnings), forward P/E (trades on expectations), EV/EBITDA (capital structure-neutral). S&P historically ~16x P/E. Rising rates increase the discount rate on future earnings, compressing multiples especially for growth stocks. Whether high P/E is justified depends on EPS growth trajectory and earnings revision direction.'},
    {q:'What\'s the difference between monetary and fiscal policy?',cat:'Macro',a:'Monetary = the Fed. Tools: interest rates, QE/QT. Goal: 2% inflation + max employment. Fiscal = Congress/Treasury. Tools: spending, taxation. Key tension: government running large deficits (fiscal expansion) while Fed tightens (monetary) = 2026 situation — fiscal stimulus fighting monetary policy, keeping inflation elevated. Warsh has flagged this explicitly.'},
    {q:'What makes a good sales professional on a trading desk?',cat:'Role Fit',a:'Three things: (1) Market fluency — credible conversation with a PM. (2) Client understanding — anticipate needs before they ask. (3) Communication — translate complex dynamics into a clear, actionable narrative quickly. The best salespeople frame information as what it means for the specific client\'s portfolio.'},
    {q:'How do you explain credit spreads to someone non-technical?',cat:'Communication',a:'"Imagine lending money to two people — one has steady income and great credit, one has been struggling. You\'d charge the struggling person a higher interest rate. That extra rate is the credit spread. When investors get nervous about the economy, they demand a bigger premium to lend to riskier borrowers — spreads widen. Tight = confidence. Wide = fear."'},
    {q:'What is a carry trade and what\'s the risk?',cat:'FX',a:'Borrow in a low-rate currency (JPY at ~0%), invest in a high-rate one (BRL, TRY). Profit = interest rate differential. Risk: if high-rate currency depreciates against your borrowed currency, you lose more than the carry. Second risk: carry unwinds violently in risk-off — everyone exits simultaneously, causing EM currency crashes. August 2024 JPY short squeeze is a great recent example.'},
  ];
  return <div>
    <SH>Interview Prep</SH>
    <p style={{fontSize:13,color:C.muted,marginBottom:20}}>Click any question to see the answer framework</p>
    <Sub>Coffee Chat Framework</Sub>
    <Card accent={C.cyan}>{[['A market theme you\'re following + why','"I\'ve been focused on the second tightening cycle — Warsh\'s anti-guidance stance and what it means for rate vol…"'],['Why S&T sales specifically','Connect to client relationships, translating complex ideas, speed of feedback loops.'],['Why this bank / desk','Research the desk. Know their products, recent deals, who covers what.'],['A question for them','"How does your desk position around Warsh\'s refusal to give forward guidance?" Not "what do you do day-to-day."']].map(([q,a])=>(<div key={q} style={{marginBottom:12,paddingLeft:12,borderLeft:`2px solid ${C.cyan}44`}}><div style={{fontSize:13,fontWeight:600,color:C.text,marginBottom:3}}>{q}</div><div style={{fontSize:12,color:C.muted,lineHeight:1.5}}>{a}</div></div>))}</Card>
    <Sub>Q&A Bank</Sub>
    {qas.map((item,i)=>(<div key={i} onClick={()=>setOpen(open===i?null:i)} style={{cursor:'pointer',marginBottom:8}}><div style={{display:'flex',gap:10,alignItems:'center',background:C.card,border:`1px solid ${open===i?C.accent:C.border}`,borderLeft:`3px solid ${open===i?C.accent:C.dim}`,borderRadius:6,padding:'11px 14px'}}><Tag color={C.purple}>{item.cat}</Tag><span style={{fontSize:13,fontWeight:500,color:C.text,flex:1}}>{item.q}</span><span style={{fontSize:11,color:C.dim}}>{open===i?'▲':'▼'}</span></div>{open===i&&<div style={{background:C.accentLo,border:`1px solid ${C.accent}33`,borderTop:'none',borderRadius:'0 0 6px 6px',padding:'14px 16px'}}><p style={{fontSize:13,lineHeight:1.8,color:C.text,margin:0}}>{item.a}</p></div>}</div>))}
  </div>;

    <div style={{width:210,background:C.surface,borderRight:`1px solid ${C.border}`,display:'flex',flexDirection:'column',flexShrink:0}}>
      <div style={{padding:'20px 16px 16px'}}>
        <div style={{fontSize:15,fontWeight:600,color:C.text,letterSpacing:'-0.01em',marginBottom:2}}>Gina's S&T Desk</div>
        <div style={{fontSize:12,color:C.muted}}>UChicago · NY S&T · 2028</div>
      </div>
      <nav style={{padding:'2px 8px',flex:1,overflowY:'auto'}}>
        {nav.map(item=>(<button key={item.id} onClick={()=>setActive(item.id)} style={{width:'100%',textAlign:'left',padding:'7px 10px',border:'none',cursor:'pointer',display:'flex',alignItems:'center',gap:8,borderRadius:6,background:active===item.id?'rgba(255,255,255,0.07)':'transparent',fontSize:13,fontWeight:active===item.id?500:400,color:active===item.id?C.text:C.muted,marginBottom:1}}><span style={{fontSize:13,opacity:0.65}}>{item.icon}</span>{item.label}</button>))}
      </nav>
      <div style={{padding:'14px 16px',borderTop:`1px solid ${C.border}`}}>
        <div style={{fontSize:12,color:C.muted,marginBottom:6}}>Recruiting cycle: Fall 2027 – Summer 2028</div>
        <div style={{fontSize:12,color:C.muted,marginBottom:10}}>Fed funds: <span style={{color:C.amber}}>3.75–4.00%</span></div>
        {!editKey
          ? <div onClick={()=>setEditKey(true)} style={{fontSize:12,color:apiKey&&apiKey!=='none'?C.green:C.muted,cursor:'pointer'}}>
              {apiKey&&apiKey!=='none'?'● API key set':'○ Add API key'}
            </div>
          : <div><input value={keyInput} onChange={e=>setKeyInput(e.target.value)} placeholder="sk-ant-..." type="password" style={{width:'100%',background:C.card,border:`1px solid ${C.border}`,borderRadius:6,padding:'6px 10px',color:C.text,fontSize:12,outline:'none',marginBottom:6,boxSizing:'border-box'}}/><button onClick={()=>{localStorage.setItem('ant_key',keyInput);setApiKey(keyInput);setEditKey(false);}} style={{fontSize:12,color:C.accent,background:'none',border:'none',cursor:'pointer',padding:0}}>Save</button></div>}
      </div>
    </div>
    <div style={{flex:1,overflow:'auto'}}>
      <div style={{maxWidth:840,margin:'0 auto',padding:'36px 48px'}}>
        {sections[active]}
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
