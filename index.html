<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gina's S&T Desk — US S&T 2028</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#191919;color:#F5F4F0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;height:100vh;overflow:hidden}
#root{height:100vh}
input,button,textarea{font-family:inherit}
input::placeholder,textarea::placeholder{color:#6B6B69}
button:hover{opacity:0.85}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3A3A3A;border-radius:3px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const{useState,useEffect,useRef,useMemo}=React;
const C={bg:'#191919',surface:'#1F1F1F',card:'#262626',border:'rgba(255,255,255,0.08)',accent:'#4087CF',accentLo:'rgba(64,135,207,0.1)',text:'#F5F4F0',muted:'#9B9A97',dim:'#6B6B69',green:'#3EAD72',red:'#C75B5B',amber:'#B5851F',purple:'#8B6BD4',cyan:'#3B92C4'};

const Tag=({children,color=C.accent})=>(<span style={{display:'inline-block',padding:'2px 9px',borderRadius:20,fontSize:11,fontWeight:500,background:`${color}18`,color,marginRight:4}}>{children}</span>);
const Card=({children,accent,style:sx={}})=>(<div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:'16px 18px',marginBottom:10,...sx}}>{children}</div>);
const SH=({children})=>(<h2 style={{fontSize:20,fontWeight:600,color:C.text,margin:'0 0 4px',letterSpacing:'-0.01em'}}>{children}</h2>);
const Sub=({children,color})=>(<div style={{fontSize:11,fontWeight:600,color:color||C.dim,textTransform:'uppercase',letterSpacing:'0.07em',margin:'24px 0 10px'}}>{children}</div>);
const P=({children})=>(<p style={{fontSize:13,lineHeight:1.75,color:C.muted,margin:'0 0 10px',maxWidth:680}}>{children}</p>);
const TabBar=({tabs,active,set})=>(<div style={{display:'flex',gap:1,marginBottom:20,borderBottom:`1px solid ${C.border}`}}>{tabs.map(t=>(<button key={t.id} onClick={()=>set(t.id)} style={{padding:'8px 16px',background:'none',border:'none',cursor:'pointer',fontSize:13,fontWeight:active===t.id?500:400,color:active===t.id?C.text:C.muted,borderBottom:active===t.id?`2px solid ${C.accent}`:'2px solid transparent',marginBottom:-1,borderRadius:'4px 4px 0 0'}}>{t.label}</button>))}</div>);
const Grid=({children,cols=2})=>(<div style={{display:'grid',gridTemplateColumns:`repeat(${cols},1fr)`,gap:9,marginBottom:12}}>{children}</div>);
function renderMarkdown(txt){if(!txt)return null;return txt.split(/(\*\*[^*]+\*\*)/g).map((p,i)=>p.startsWith('**')&&p.endsWith('**')?<strong key={i} style={{fontWeight:700,color:'inherit'}}>{p.slice(2,-2)}</strong>:p);}

function getKey(){return localStorage.getItem('ant_key')||'';}

async function callClaude(messages,system,useSearch=false,model='claude-sonnet-4-6',maxTokens=1000){
  const apiKey=getKey();
  if(!apiKey)throw new Error('No API key set — add it in the sidebar below.');
  const body={model,max_tokens:maxTokens,system,messages:messages.map(m=>({role:m.role,content:m.content}))};
  if(useSearch)body.tools=[{type:'web_search_20250305',name:'web_search'}];
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify(body)
  });
  const data=await res.json();
  if(data.error)throw new Error(data.error.message);
  return data.content.filter(b=>b.type==='text').map(b=>b.text).join('');
}

function TodaySection(){
  const[brief,setBrief]=useState(null);
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState(null);
  const[autoLoaded,setAutoLoaded]=useState(null);
  const today=new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const dateKey=new Date().toISOString().split('T')[0];
  useEffect(()=>{
    async function tryAutoLoad(){
      try{
        const r=await fetch('public/brief.json?t='+Date.now());
        if(r.ok){const data=await r.json();if(data.date===dateKey){setBrief(data);setAutoLoaded(new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}));try{localStorage.setItem(`brief_${dateKey}`,JSON.stringify(data));}catch(e){} return;}}
      }catch(e){}
      try{const c=localStorage.getItem(`brief_${dateKey}`);if(c)setBrief(JSON.parse(c));}catch(e){}
    }
    tryAutoLoad();
  },[]);
  async function generate(){
    setLoading(true);setError(null);
    const prompt=`Today is ${today}. Search for the latest US financial market data and news. Return ONLY a JSON object, no markdown: {"date":"${today}","market_levels":[{"name":"S&P 500","value":"...","change":"...","up":true},{"name":"10Y UST","value":"...%","change":"... bps","up":true},{"name":"2Y UST","value":"...%","change":"... bps","up":true},{"name":"DXY","value":"...","change":"...","up":false},{"name":"VIX","value":"...","change":"...","up":false}],"stories":[{"headline":"...","source":"...","summary":"2-3 sentences","why_matters":"...","tag":"Rates|Equities|FX|Macro|Credit"},{"headline":"...","source":"...","summary":"...","why_matters":"...","tag":"..."},{"headline":"...","source":"...","summary":"...","why_matters":"...","tag":"..."}],"calendar":[{"day":"...","event":"...","importance":"high|medium","note":"..."},{"day":"...","event":"...","importance":"medium","note":"..."}],"concept":{"title":"...","one_liner":"...","explanation":"2-3 sentences","market_link":"How this connects to today"},"narrative":"1-2 sentence macro narrative update"}`;
    try{
      const text=await callClaude([{role:'user',content:prompt}],'You are a US financial markets assistant. Search for current market data and news. Return ONLY valid JSON without any markdown fences or explanation text before or after.',true,'claude-haiku-4-5-20251001',2500);
      const cleaned=text.replace(/```json|```/g,'').trim();
      const start=cleaned.indexOf('{');const end=cleaned.lastIndexOf('}');
      const b=JSON.parse(cleaned.slice(start,end+1));
      setBrief(b);
      try{localStorage.setItem(`brief_${dateKey}`,JSON.stringify(b));}catch(e){}
    }catch(err){setError(err.message);}
    setLoading(false);
  }
  const tagColor=t=>({Rates:C.amber,Equities:C.green,FX:C.purple,Macro:C.cyan,Credit:C.red}[t]||C.muted);
  return <div>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
      <div><SH>Today's Brief</SH><div style={{fontSize:13,color:C.muted,marginTop:2}}>{today}{autoLoaded&&<span style={{marginLeft:10,fontSize:11,color:C.green,fontWeight:600}}>✓ Auto-loaded · {autoLoaded}</span>}</div></div>
      <button onClick={generate} disabled={loading} style={{padding:'9px 18px',background:C.accent,border:'none',borderRadius:6,color:'#fff',fontSize:13,fontWeight:600,cursor:loading?'not-allowed':'pointer',opacity:loading?0.6:1}}>{loading?'Fetching…':brief?'↻ Refresh':'⚡ Generate Today\'s Brief'}</button>
    </div>
    {error&&<Card accent={C.red}><div style={{fontSize:13,color:C.red}}>{error}</div></Card>}
    {!brief&&!loading&&<Card accent={C.dim} style={{textAlign:'center',padding:'40px 20px'}}><div style={{fontSize:32,marginBottom:12}}>⚡</div><div style={{fontSize:14,color:C.muted,marginBottom:6}}>Hit Generate to pull live market data + today's top stories</div><div style={{fontSize:12,color:C.dim}}>Searches the web — saves so you don't re-fetch the same day</div></Card>}
    {loading&&<Card accent={C.accent} style={{textAlign:'center',padding:'40px 20px'}}><div style={{fontSize:13,color:C.muted}}>Searching market data and news…</div></Card>}
    {brief&&<>
      <Sub>Market Levels</Sub>
      <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:8,marginBottom:20}}>
        {brief.market_levels?.map(m=>(<div key={m.name} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:6,padding:'12px 12px'}}><div style={{fontSize:11,color:C.muted,marginBottom:4}}>{m.name}</div><div style={{fontSize:16,fontWeight:700,color:C.text,marginBottom:2}}>{m.value}</div><div style={{fontSize:12,color:m.up?C.green:C.red,fontFamily:'monospace'}}>{m.change}</div></div>))}
      </div>
      <Sub>Top Stories</Sub>
      {brief.stories?.map((s,i)=>(<Card key={i} accent={tagColor(s.tag)}><div style={{display:'flex',gap:8,alignItems:'baseline',marginBottom:6}}><span style={{fontSize:13,fontWeight:600,color:C.text,flex:1}}>{s.headline}</span><Tag color={tagColor(s.tag)}>{s.tag}</Tag><span style={{fontSize:11,color:C.dim}}>{s.source}</span></div><div style={{fontSize:13,color:C.muted,lineHeight:1.6,marginBottom:6}}>{s.summary}</div><div style={{fontSize:12}}><span style={{color:C.dim}}>Why it matters: </span><span style={{color:tagColor(s.tag)}}>{s.why_matters}</span></div></Card>))}
      <Sub>This Week</Sub>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(240px,1fr))',gap:8,marginBottom:20}}>
        {brief.calendar?.map((e,i)=>(<div key={i} style={{background:C.card,border:`1px solid ${e.importance==='high'?C.amber:C.border}`,borderRadius:6,padding:'10px 12px'}}><div style={{display:'flex',gap:8,alignItems:'center',marginBottom:4}}><span style={{fontFamily:'monospace',fontSize:11,color:e.importance==='high'?C.amber:C.muted}}>{e.day}</span>{e.importance==='high'&&<Tag color={C.amber}>Key</Tag>}</div><div style={{fontSize:13,fontWeight:500,color:C.text,marginBottom:3}}>{e.event}</div><div style={{fontSize:12,color:C.muted}}>{e.note}</div></div>))}
      </div>
      {brief.concept&&<><Sub>Concept of the Day</Sub><Card accent={C.purple}><div style={{fontSize:16,fontWeight:700,color:C.text,marginBottom:4}}>{brief.concept.title}</div><div style={{fontSize:13,color:C.cyan,marginBottom:8,fontStyle:'italic'}}>{brief.concept.one_liner}</div><P>{brief.concept.explanation}</P><div style={{fontSize:12,color:C.purple}}><span style={{color:C.dim}}>Today's connection: </span>{brief.concept.market_link}</div></Card></>}
      {brief.narrative&&<><Sub>Macro Narrative</Sub><Card accent={C.amber}><p style={{fontSize:13,lineHeight:1.75,color:C.text,margin:0,fontStyle:'italic'}}>"{brief.narrative}"</p></Card></>}
    </>}
  </div>;
}

function LearnSection(){
  const LEARN_KEY='st_learn_msgs';
  const defaultMsg={role:'assistant',content:"Hey Gina! I'm your S&T tutor. Ask me anything — concepts, trade ideas, how a specific desk works, interview prep, or what's happening in markets right now."};
  const[msgs,setMsgs]=useState(()=>{try{const s=localStorage.getItem(LEARN_KEY);if(s){const p=JSON.parse(s);if(Array.isArray(p)&&p.length)return p;}return[defaultMsg];}catch(e){return[defaultMsg];}});
  const[input,setInput]=useState('');
  const[loading,setLoading]=useState(false);
  const bottomRef=useRef(null);
  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:'smooth'});},[msgs]);
  useEffect(()=>{try{localStorage.setItem(LEARN_KEY,JSON.stringify(msgs));}catch(e){};},[msgs]);
  const quick=["Walk me through duration and why 2022 was catastrophic for bonds","Quiz me on yield curve shapes — give me a scenario","Explain the difference between rates sales and rates trading","What should I know about the current macro environment for an interview?","Give me a practice trade idea to work through step by step","Why is Warsh more hawkish than Powell?","How does a rates sales desk make money?","Walk me through earnings season on an equities desk"];
  async function send(text){
    const msg=text||input.trim();if(!msg)return;
    const newMsgs=[...msgs,{role:'user',content:msg}];
    setMsgs(newMsgs);setInput('');setLoading(true);
    try{
      const reply=await callClaude(newMsgs,'You are an S&T tutor for Gina, a UChicago sophomore targeting US S&T sales roles (NY, Summer 2028). She is in PAIR investment club, exploring which product area (rates, equities, FX, credit). Current macro: Fed Chair Warsh hiked to 3.75-4.00% Sept 2026, second tightening cycle, oil above $100 from Strait of Hormuz, core PCE 3.3%. Be direct, concrete, real examples. Socratic method when useful. Under 200 words unless a complex concept needs more.');
      setMsgs([...newMsgs,{role:'assistant',content:reply}]);
    }catch(e){setMsgs([...newMsgs,{role:'assistant',content:`Error: ${e.message}`}]);}
    setLoading(false);
  }
  return <div style={{display:'flex',flexDirection:'column',height:'calc(100vh - 120px)'}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}><SH>Learn</SH><button onClick={()=>{if(window.confirm('Clear chat history?')){setMsgs([defaultMsg]);localStorage.removeItem(LEARN_KEY);}}} style={{background:'none',border:'none',cursor:'pointer',fontSize:12,color:C.dim,padding:'4px 8px',borderRadius:4}}>Clear history</button></div>
    <p style={{fontSize:13,color:C.muted,marginBottom:16}}>Your live S&T tutor — history saved between tabs</p>
    <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:16}}>{quick.map(p=><button key={p} onClick={()=>send(p)} style={{padding:'5px 10px',background:C.card,border:`1px solid ${C.border}`,borderRadius:4,fontSize:12,color:C.muted,cursor:'pointer',textAlign:'left'}}>{p}</button>)}</div>
    <div style={{flex:1,overflow:'auto',background:C.surface,borderRadius:8,border:`1px solid ${C.border}`,padding:16,marginBottom:12}}>
      {msgs.map((m,i)=>(<div key={i} style={{display:'flex',gap:10,marginBottom:14,flexDirection:m.role==='user'?'row-reverse':'row'}}><div style={{width:28,height:28,borderRadius:'50%',flexShrink:0,background:m.role==='user'?C.accent:C.purple,display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,color:'#fff'}}>{m.role==='user'?'G':'T'}</div><div style={{maxWidth:'78%',background:m.role==='user'?C.accentLo:C.card,border:`1px solid ${m.role==='user'?C.accent+'33':C.border}`,borderRadius:8,padding:'10px 14px',fontSize:13,color:C.text,lineHeight:1.7,whiteSpace:'pre-wrap'}}>{renderMarkdown(m.content)}</div></div>))}
      {loading&&<div style={{display:'flex',gap:10,marginBottom:14}}><div style={{width:28,height:28,borderRadius:'50%',background:C.purple,display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,color:'#fff'}}>T</div><div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:'10px 14px',fontSize:13,color:C.muted}}>thinking…</div></div>}
      <div ref={bottomRef}/>
    </div>
    <div style={{display:'flex',gap:8}}>
      <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&send()} placeholder="Ask anything…" style={{flex:1,background:C.card,border:`1px solid ${C.border}`,borderRadius:6,padding:'10px 14px',color:C.text,fontSize:13,outline:'none'}}/>
      <button onClick={()=>send()} disabled={loading||!input.trim()} style={{padding:'10px 18px',background:C.accent,border:'none',borderRadius:6,color:'#fff',fontSize:13,fontWeight:600,cursor:loading?'not-allowed':'pointer',opacity:loading?0.5:1}}>Send</button>
    </div>
  </div>;
}

function ProductsSection(){
  const[sel,setSel]=useState(null);
  const[quizMsgs,setQuizMsgs]=useState([{role:'assistant',content:"Let's figure out which S&T desk might fit you best. I'll ask a few questions — answer naturally and I'll give you a real recommendation.\n\nFirst: when you imagine yourself at work in 5 years, what matters more — being the person who knows a specific market deeply and can trade it, or being the person who talks to the biggest clients and translates complex ideas into decisions?"}]);
  const[quizInput,setQuizInput]=useState('');
  const[quizLoading,setQuizLoading]=useState(false);
  const[quizOpen,setQuizOpen]=useState(false);
  const quizBottom=useRef(null);
  useEffect(()=>{quizBottom.current?.scrollIntoView({behavior:'smooth'});},[quizMsgs]);
  async function sendQuiz(){
    const msg=quizInput.trim();if(!msg)return;
    const newMsgs=[...quizMsgs,{role:'user',content:msg}];
    setQuizMsgs(newMsgs);setQuizInput('');setQuizLoading(true);
    try{
      const reply=await callClaude(newMsgs,'You are helping Gina, a UChicago sophomore, figure out which S&T product desk suits her best. Options: Rates/Fixed Income, Equities, FX & Commodities, Credit. Ask 3-4 probing questions one at a time, then give a direct recommendation. She targets sales roles specifically. Be opinionated — give a real top pick + runner-up with specific reasoning. After 4 exchanges, give a definitive recommendation.');
      setQuizMsgs([...newMsgs,{role:'assistant',content:reply}]);
    }catch(e){setQuizMsgs([...newMsgs,{role:'assistant',content:`Error: ${e.message}`}]);}
    setQuizLoading(false);
  }
  const products=[
    {id:'rates',color:C.accent,icon:'∿',name:'Rates / Fixed Income',tagline:'The backbone of institutional markets — most relevant desk right now',what:'Rates desks trade US Treasuries, agency bonds, interest rate swaps, swaptions, and Treasury futures. By notional volume, the largest desk at any major bank. You\'re trading the most important instrument in the world.',dayInLife:'Morning: check overnight Treasury moves, any Fed speakers, where the 2s10s opened. Sales: calling accounts about how to position around the upcoming FOMC or CPI print. Trading: managing duration risk in the Treasury book, hedging DV01 exposure.',clients:'Asset managers (BlackRock, PIMCO), pension funds, insurance companies, central banks, macro hedge funds.',skills:['Strong macro intuition (Fed, inflation, growth cycle)','Comfort with duration / DV01 math','Yield curve mechanics — reading shape and moves','Fast with numbers under pressure'],interesting:'You are permanently connected to the most important variable in finance. Every market event — CPI, FOMC, geopolitical shock — shows up in rates first. The 2022–2026 rate cycle has made this the most dynamic desk at most banks.',hard:'Steep learning curve, very math-heavy, increasingly electronic at the plain-vanilla end.',green:['You love macro more than company-specific stories','Mental math feels natural','You want to be fluent in the instrument that anchors every other asset'],red:['You want more narrative/story-driven selling','You prefer equity-style conviction trades over macro positioning'],interview:'Yield curve mechanics, duration math, Fed policy, DV01 sizing, current rate environment'},
    {id:'equities',color:C.green,icon:'◆',name:'Equities S&T',tagline:'The most visible product — stocks, sectors, earnings, IPOs, flows',what:'Market-making and flow trading in stocks, ETFs, and equity derivatives (options, equity futures). Handles the most visible trades — mega-caps, earnings plays, sector rotations, IPO allocations, block trades.',dayInLife:'Pre-market: check futures, overnight ADRs, analyst upgrades/downgrades, any earnings. Sales: calling hedge fund accounts about earnings setup, sector rotation, how to play AI capex theme. Trading: managing delta/gamma on options book, handling block trades.',clients:'Long/short hedge funds (primary), long-only asset managers, quant funds, multi-strategy pods.',skills:['Earnings analysis — EPS setup, guidance, beats/misses','Sector knowledge — what drives each sector\'s P/E','Reading positioning and fund flows','Comfortable discussing specific companies and names'],interesting:'Most intuitive product if you follow stocks. Directly connected to company fundamentals + macro. AI theme, earnings volatility, mega-cap concentration have made equities fascinating.',hard:'Equity sales under structural pressure — more algorithmic execution, fewer relationship-driven block trades.',green:['You follow stocks, read earnings reports, have opinions on specific companies','PAIR investment club analysis feels natural','You like connecting macro to sector rotation stories'],red:['Pure macro > company-specific analysis for you','You don\'t want to spend time on individual stock stories'],interview:'Valuation metrics (P/E, EV/EBITDA), earnings dynamics, sector rotation, current AI/tech theme, trade idea on a specific name'},
    {id:'fx',color:C.amber,icon:'⟐',name:'FX & Commodities',tagline:'Pure global macro — every geopolitical event shows up here first',what:'Trading G10 currencies (EUR, JPY, GBP), EM currencies, commodity currencies, spot/forwards/options on FX. Commodities: oil, gold, base metals. Often combined at mid-size banks.',dayInLife:'FX never sleeps — Asia opens at 7pm ET, London at 3am. Sales: calling corporates hedging FX exposure, macro hedge funds about positioning around DXY. Trading: managing G10 book around data releases.',clients:'Corporates (hedging currency exposure), real money asset managers, macro hedge funds.',skills:['Deep macro intuition and geopolitical awareness','Understanding of interest rate differentials and carry','Fast reflexes — FX spot is the fastest market','Comfort with global complexity (multiple central banks simultaneously)'],interesting:'The most global product. Every central bank decision, geopolitical event (Strait of Hormuz, Taiwan) — shows up in FX immediately. You track the Fed AND ECB AND BOJ AND PBOC simultaneously.',hard:'Spot FX dominated by HFT — human edge in complex products, EM, and client relationships.',green:['Geopolitics and global macro genuinely excites you','The oil/Strait of Hormuz story feels more interesting than any single earnings report','You want to trade the most global instrument'],red:['You prefer deep dives on one market vs. tracking 20+ simultaneously'],interview:'Carry trade mechanics, DXY drivers, central bank policy transmission to FX, current oil narrative'},
    {id:'credit',color:C.purple,icon:'◈',name:'Credit',tagline:'Macro + micro combined — fastest-growing institutional desk',what:'Investment grade and high yield corporate bonds, credit derivatives (CDS, CDX indices), structured credit (CLOs, ABS, MBS). Sales means calling accounts about new issue pipeline, spread dynamics, credit cycle positioning.',dayInLife:'Morning: check CDX.NA.IG and CDX.NA.HY spreads, any overnight corporate news. Sales: calling insurance company accounts about IG new issuance, credit hedge funds about HY spread trades. Trading: managing IG/HY bond inventory, hedging with CDX.',clients:'Insurance companies (massive IG buyers), pension funds, credit hedge funds, CLO managers.',skills:['Credit analysis — individual issuer fundamentals','Macro credit cycle intuition (default rates, spread dynamics)','Structured products basics (CLOs, ABS)','IG vs. HY distinction'],interesting:'Unique blend of macro (credit cycle, rate environment) and micro (individual company creditworthiness). Private credit explosion means credit knowledge valued far beyond the trading desk.',hard:'Less liquid than rates or equities, more OTC/bilateral.',green:['You like both macro AND company analysis','Private credit boom and growing asset class appeals to you','Interested in structured products world'],red:['You want the fastest-paced most liquid desk'],interview:'Credit spread mechanics, IG vs. HY, duration vs. credit beta, default/recovery dynamics'},
  ];
  return <div>
    <SH>Product Explorer</SH>
    <p style={{fontSize:13,color:C.muted,marginBottom:20}}>Learn each desk — then use the quiz to figure out which fits you</p>
    <Card accent={C.amber}><P><strong style={{color:C.text}}>How to use this:</strong> Read through all four areas. Notice which makes you think "that sounds like me" vs. "I could do that." Then use the quiz at the bottom for a direct recommendation. Once you know your product, go to <strong style={{color:C.accent}}>Your Edge</strong>.</P></Card>
    {products.map(p=>(<div key={p.id} style={{marginBottom:10}}>
      <div onClick={()=>setSel(sel===p.id?null:p.id)} style={{display:'flex',gap:14,alignItems:'center',background:C.card,border:`1px solid ${sel===p.id?p.color:C.border}`,borderLeft:`3px solid ${p.color}`,borderRadius:sel===p.id?'6px 6px 0 0':6,padding:'14px 16px',cursor:'pointer'}}>
        <span style={{fontSize:18,color:p.color}}>{p.icon}</span>
        <div style={{flex:1}}><div style={{fontSize:14,fontWeight:700,color:C.text,marginBottom:2}}>{p.name}</div><div style={{fontSize:12,color:C.muted}}>{p.tagline}</div></div>
        <span style={{fontSize:11,color:C.dim}}>{sel===p.id?'▲':'▼'}</span>
      </div>
      {sel===p.id&&<div style={{background:`${p.color}06`,border:`1px solid ${p.color}33`,borderTop:'none',borderRadius:'0 0 6px 6px',padding:'20px 20px'}}>
        <Grid>
          <div>
            <div style={{fontSize:11,fontWeight:700,color:p.color,letterSpacing:'0.08em',marginBottom:8}}>WHAT THE DESK DOES</div>
            <p style={{fontSize:13,color:C.text,lineHeight:1.7,margin:'0 0 16px'}}>{p.what}</p>
            <div style={{fontSize:11,fontWeight:700,color:p.color,letterSpacing:'0.08em',marginBottom:8}}>A DAY IN THE LIFE (SALES)</div>
            <p style={{fontSize:13,color:C.text,lineHeight:1.7,margin:'0 0 16px'}}>{p.dayInLife}</p>
            <div style={{fontSize:11,fontWeight:700,color:p.color,letterSpacing:'0.08em',marginBottom:8}}>TYPICAL CLIENTS</div>
            <p style={{fontSize:13,color:C.muted,lineHeight:1.7,margin:0}}>{p.clients}</p>
          </div>
          <div>
            <div style={{fontSize:11,fontWeight:700,color:p.color,letterSpacing:'0.08em',marginBottom:8}}>KEY SKILLS</div>
            {p.skills.map(s=><div key={s} style={{fontSize:13,color:C.text,marginBottom:5,paddingLeft:10,borderLeft:`2px solid ${p.color}33`}}>{s}</div>)}
            <div style={{fontSize:11,fontWeight:700,color:p.color,letterSpacing:'0.08em',margin:'16px 0 8px'}}>WHY IT'S INTERESTING</div>
            <p style={{fontSize:13,color:C.text,lineHeight:1.7,margin:'0 0 16px'}}>{p.interesting}</p>
            <div style={{fontSize:11,fontWeight:700,color:p.color,letterSpacing:'0.08em',marginBottom:8}}>WATCH OUT FOR</div>
            <p style={{fontSize:13,color:C.muted,lineHeight:1.7,margin:0}}>{p.hard}</p>
          </div>
        </Grid>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginTop:4}}>
          <div style={{background:`${C.green}0A`,border:`1px solid ${C.green}22`,borderRadius:6,padding:'12px 14px'}}><div style={{fontSize:11,fontWeight:700,color:C.green,marginBottom:8}}>🟢 MIGHT BE YOU IF…</div>{p.green.map(g=><div key={g} style={{fontSize:12,color:C.text,marginBottom:5,lineHeight:1.5}}>· {g}</div>)}</div>
          <div style={{background:`${C.red}0A`,border:`1px solid ${C.red}22`,borderRadius:6,padding:'12px 14px'}}><div style={{fontSize:11,fontWeight:700,color:C.red,marginBottom:8}}>🔴 MAYBE NOT IF…</div>{p.red.map(r=><div key={r} style={{fontSize:12,color:C.text,marginBottom:5,lineHeight:1.5}}>· {r}</div>)}</div>
        </div>
        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:6,padding:'10px 14px',marginTop:10}}><span style={{fontSize:11,fontWeight:700,color:C.muted,letterSpacing:'0.08em'}}>INTERVIEW TESTS: </span><span style={{fontSize:12,color:C.text}}>{p.interview}</span></div>
      </div>}
    </div>))}
    <div style={{marginTop:24}}>
      <div onClick={()=>setQuizOpen(!quizOpen)} style={{display:'flex',alignItems:'center',justifyContent:'space-between',background:C.card,border:`1px solid ${quizOpen?C.cyan:C.border}`,borderLeft:`3px solid ${C.cyan}`,borderRadius:quizOpen?'6px 6px 0 0':6,padding:'14px 16px',cursor:'pointer'}}>
        <div><div style={{fontSize:14,fontWeight:700,color:C.text,marginBottom:2}}>Help me choose my product area</div><div style={{fontSize:12,color:C.muted}}>Answer a few questions → get a direct recommendation</div></div>
        <span style={{fontSize:11,color:C.dim}}>{quizOpen?'▲':'▼'}</span>
      </div>
      {quizOpen&&<div style={{background:C.surface,border:`1px solid ${C.cyan}33`,borderTop:'none',borderRadius:'0 0 6px 6px',padding:16}}>
        <div style={{maxHeight:340,overflow:'auto',marginBottom:12}}>
          {quizMsgs.map((m,i)=>(<div key={i} style={{display:'flex',gap:10,marginBottom:12,flexDirection:m.role==='user'?'row-reverse':'row'}}><div style={{width:26,height:26,borderRadius:'50%',flexShrink:0,background:m.role==='user'?C.accent:C.cyan,display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,color:'#fff'}}>{m.role==='user'?'G':'?'}</div><div style={{maxWidth:'80%',background:m.role==='user'?C.accentLo:C.card,border:`1px solid ${m.role==='user'?C.accent+'33':C.border}`,borderRadius:8,padding:'9px 13px',fontSize:13,color:C.text,lineHeight:1.7,whiteSpace:'pre-wrap'}}>{m.content}</div></div>))}
          {quizLoading&&<div style={{display:'flex',gap:10,marginBottom:12}}><div style={{width:26,height:26,borderRadius:'50%',background:C.cyan,display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,color:'#fff'}}>?</div><div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:'9px 13px',fontSize:13,color:C.muted}}>thinking…</div></div>}
          <div ref={quizBottom}/>
        </div>
        <div style={{display:'flex',gap:8}}>
          <input value={quizInput} onChange={e=>setQuizInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&sendQuiz()} placeholder="Type your answer…" style={{flex:1,background:C.card,border:`1px solid ${C.border}`,borderRadius:6,padding:'9px 13px',color:C.text,fontSize:13,outline:'none'}}/>
          <button onClick={sendQuiz} disabled={quizLoading||!quizInput.trim()} style={{padding:'9px 16px',background:C.cyan,border:'none',borderRadius:6,color:'#fff',fontSize:13,fontWeight:600,cursor:quizLoading?'not-allowed':'pointer',opacity:quizLoading?0.5:1}}>Send</button>
        </div>
      </div>}
    </div>
  </div>;
}

function ModelSection(){
  const PE=({col,children})=>(<div style={{fontSize:13,color:C.text,lineHeight:1.7,background:`${col||C.accent}0E`,borderRadius:6,padding:'10px 14px',marginBottom:6,borderLeft:`2px solid ${col||C.accent}50`}}><span style={{fontSize:10,fontWeight:600,color:col||C.accent,letterSpacing:'0.07em',marginRight:8,opacity:0.9}}>Plain English</span>{children}</div>);
  const TE=({children})=>(<div style={{fontSize:12,color:C.muted,lineHeight:1.7,background:'rgba(255,255,255,0.03)',borderRadius:6,padding:'10px 14px',borderLeft:`2px solid ${C.border}`}}><span style={{fontSize:10,fontWeight:600,color:C.dim,letterSpacing:'0.07em',marginRight:8}}>Technical</span>{children}</div>);
  return <div>
    <SH>The Mental Model</SH>
    <p style={{fontSize:13,color:C.muted,marginBottom:20}}>How professionals actually think about markets — explained from scratch</p>
    <Card>
      <PE col={C.accent}>Think of every price as a collective vote. All investors are betting on what something is worth <em>in the future</em>. The price you see is the average of everyone's best guess. So the question isn't "is this company good?" — it's <strong style={{color:C.amber}}>"does the price already reflect how good it is?"</strong></PE>
      <TE>Markets are discounting machines. Every asset price reflects aggregate expectations of future cash flows discounted at a risk-adjusted rate (P = CF₁/(1+r) + CF₂/(1+r)² + ...). New information shifts expectations → price adjusts. The question is never quality per se but whether current price correctly embeds all available information.</TE>
    </Card>
    <Sub>The Hierarchy — How Professionals Think Top-Down</Sub>
    {[['01',C.accent,'Central Bank Policy','The Fed sets the "risk-free rate" — the guaranteed return you can earn on US Treasury bills with zero risk. This is the floor beneath every investment. When that floor rises, riskier investments like stocks have to compete with it, so they have to become cheaper to stay attractive.','The risk-free rate anchors all asset valuations via the discount rate in DCF models. Fed policy shifts the denominator in every present value calculation. Rates rise → discount rate rises → present value of all future cash flows falls → asset prices fall. Long-duration assets (growth stocks, 30Y bonds) feel it hardest — their cash flows are further in the future.'],['02',C.cyan,'Macro Regime','Which phase of the economic cycle are we in? A growing economy plays by completely different rules than a slowing one. The single biggest decision in portfolio management — risk-on or risk-off — is made at this layer.','Economic regime determines factor performance and cross-asset positioning. Expansion = credit spreads tight, equities bid, cyclicals outperform. Contraction = flight to Treasuries, spread widening, defensives outperform. Regime identification is the primary signal in macro top-down strategy.'],['03',C.green,'Asset Class Outlook','Given the economy and rates, which big buckets win? Stocks, bonds, currencies, commodities, and alternatives all behave very differently in different conditions. Getting this right matters more than picking individual stocks.','Cross-asset allocation conditional on the macro regime. Risk parity, 60/40, and tactical overlay strategies operate here. Within-regime cross-asset dispersion often exceeds security-level alpha — getting this layer right matters more than individual stock-picking.'],['04',C.muted,'Sector / Security','Only after the first three layers do professionals narrow to specific industries or individual names. Even the best stock-picker loses money if they\'re long technology when the Fed is aggressively hiking rates.','Security selection is the residual after factor and regime effects. Sector rotation within equities (tech vs. energy vs. financials) is largely regime-driven. Pure bottom-up selection without macro context systematically underperforms in stress periods.']].map(([n,col,title,plain,tech])=>(<div key={n} style={{display:'flex',gap:14,marginBottom:10,background:C.card,border:`1px solid ${C.border}`,borderLeft:`3px solid ${col}`,borderRadius:6,padding:'14px 16px'}}><span style={{fontFamily:'monospace',fontSize:13,color:col,minWidth:24,paddingTop:2,fontWeight:700}}>{n}</span><div style={{flex:1}}><div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:8}}>{title}</div><PE col={col}>{plain}</PE><TE>{tech}</TE></div></div>))}
    <Sub>Three Questions for Any View</Sub>
    <p style={{fontSize:13,color:C.muted,marginBottom:12}}>Every professional answers these before making any trade or recommendation. Mastering these is what separates people who "follow markets" from people who can actually trade them.</p>
    {[['What\'s priced in?',C.cyan,'Look at a current price — it\'s not just a number. It\'s telling a story about what investors collectively expect to happen. A stock at $100 implies specific earnings growth, a specific interest rate path, specific risks. Your first job is to figure out what story the price is telling, before you decide whether you agree.','The current price implies a probability-weighted distribution of future states. "Priced in" = what consensus has embedded in option-implied distributions, market forwards, and analyst estimates. Derive the implied scenario: what GDP, what earnings trajectory, what yield level does the current price require? Compare to your own forecast to find the edge.'],['What\'s my variant view?',C.amber,'If you think exactly what everyone else thinks, trading is a coin flip. The edge comes from correctly identifying where the crowd\'s assumptions are wrong — and why. Maybe you have better data, a different model, or you see a behavioral bias the market is systematically making.','Alpha requires a differentiated view: different base case or different probability weights on tail scenarios. Sources of edge: informational (better research), analytical (better model), or behavioral (market systematically mis-pricing). Without genuine variant view, you\'re paying bid-ask spread for random noise. The variant view must be specific and falsifiable.'],['What\'s the catalyst?',C.purple,'Even if you\'re right, you lose money if the market never changes its mind. You need a specific event that will force other investors to update their view — a CPI print, FOMC meeting, earnings release, geopolitical development. Without a catalyst, you might wait years for the market to come around.','Catalyst = the information event that forces repricing. Without a dated catalyst, you underwrite basis risk and carry costs indefinitely. Catalyst timing risk is real — right thesis, wrong timing = loss. Good trade structure: variant view + instrument (best risk/reward expression) + catalyst (dated trigger) + risk (what invalidates the thesis).']].map(([q,col,plain,tech])=>(<Card key={q} accent={col}><div style={{fontSize:13,fontWeight:700,color:col,marginBottom:8}}>{q}</div><PE col={col}>{plain}</PE><TE>{tech}</TE></Card>))}
    <Sub>Risk-On vs. Risk-Off — The Core Pattern</Sub>
    <Card accent={C.dim}><P><strong style={{color:C.text}}>The single most used framework in S&T.</strong> When investors feel <strong style={{color:C.green}}>safe and confident</strong> (risk-on), they move money toward higher-returning but riskier assets. When scared (risk-off), they flee to safety. This causes very predictable <em>simultaneous</em> moves across all markets. Learn this and you can anticipate what happens in rates, equities, FX, and commodities at the same time.</P></Card>
    {[[C.green,'RISK-ON','Economy growing, investors confident. Money flows toward higher-returning riskier assets.',[
      ['Equities rally','Investors are willing to own stocks — uncertain future returns — because they\'re confident the economy will deliver those returns. Stock prices bid up.','Equity risk premium (ERP) compresses. Investors demand less compensation for uncertainty. P/E multiples expand (same earnings, higher price). High-beta and cyclical names lead.'],
      ['HY spreads tighten','HY = High Yield = bonds from financially shaky companies ("junk bonds"). Normally investors demand big extra interest to lend to risky companies — that extra rate is the "spread." In risk-on, they\'re OK lending to riskier borrowers for a smaller premium, so spreads shrink.','HY spread (OAS) = yield premium over equivalent-duration Treasuries demanded for corporate default risk. Risk-on → default probability falls + investors reach for yield → spreads compress. CDX.NA.HY is real-time proxy. Tight = <300bps; normal = 300–500bps; crisis = 800bps+.'],
      ['EM currencies strengthen','EM = Emerging Markets (Brazil, India, Turkey, etc.). When confident, investors send money to EM to chase higher returns. Buying EM assets requires buying EM currencies, bidding them up.','Capital flows into EM on search-for-yield and growth premium. Carry trades (borrow JPY, invest in BRL) are the signature risk-on expression. EM FX (BRL, INR, ZAR) appreciates vs. safe havens. Commodity EM currencies (AUD, CAD) also benefit from risk-on commodity demand.'],
      ['USD weakens','The US Dollar is the world\'s safety blanket. When calm, fewer people need it. Demand for USD falls, so it gets cheaper vs. other currencies.','USD is a global risk-off haven (reserve currency status, Treasury market depth, flight-to-safety dynamics). Risk-on → haven demand falls → DXY weakens. Capital rotates from USD into higher-yielding EM and growth assets.'],
      ['Gold flat or down','Gold doesn\'t pay interest — it\'s a pure panic asset. When people aren\'t panicking, they don\'t need gold insurance. It may fall if the opportunity cost is high (5% Treasuries vs. 0% gold yield).','Gold is a tail hedge and real asset hedge. Inversely correlated with real interest rates. Risk-on → higher growth expectations → higher real rates → gold underperforms. Gold shines when real rates are negative or in geopolitical crisis.'],
      ['VIX falls','VIX = the "Fear Index." It measures how much unpredictability options traders expect in the S&P 500 over the next 30 days. Low VIX = calm markets. Think of it as the price of market insurance — when calm, insurance is cheap.','VIX is CBOE 30-day S&P 500 implied vol (annualized). It\'s the consensus expected standard deviation of S&P returns derived from option prices. Below 15 = complacent. 15–25 = normal concern. 25–35 = elevated stress. Above 40 = crisis. Low VIX = options are cheap = investors aren\'t buying hedges.'],
    ]],[C.red,'RISK-OFF','Markets stressed — recession fear, geopolitical shock, financial crisis. Investors flee to safety.',[
      ['Equities sell off','When scared, investors don\'t want to own stocks — uncertain future returns look very risky vs. holding safe assets. Everyone sells simultaneously, prices crash.','Equity risk premium expands → P/E multiples compress → prices fall. Long-duration assets (growth, tech) and high-beta names suffer most. Defensive sectors (utilities, staples) outperform relatively.'],
      ['HY spreads widen','Now investors worry shaky companies might default if the economy slows. They demand much higher interest rates to compensate. When everyone tries to sell HY bonds at once, prices crash and yields spike.','HY spreads widen as default probabilities rise + forced selling from VaR limits and margin calls. CDX.NA.HY can move 200–500bps in acute risk-off. Wider spreads = higher cost of capital = earnings compression = negative credit cycle feedback loop.'],
      ['EM currencies weaken','Investors pull money out of risky EM economies and bring it back to safety. Selling EM assets requires selling EM currencies, so they crash.','EM FX pressured by capital outflows, carry trade unwinds (JPY carry being closed), commodity price falls, and tightening USD liquidity. Contagion: all EM sells simultaneously regardless of individual country fundamentals.'],
      ['USD rallies','Everyone runs to US Dollars as the safest, most liquid asset on earth. Massive demand for safety bids the dollar up sharply.','USD demand surges for three reasons: (1) safe haven flows into Treasuries, (2) USD margin calls force buying, (3) short USD positions squeezed. DXY rallies broadly. "Dollar smile" — USD wins both in US economic boom and global risk-off.'],
      ['Gold rallies','People buy gold as insurance against financial collapse, extreme inflation, or geopolitical catastrophe — scenarios where even government bonds might fail.','Gold demand rises for tail hedge and store-of-value properties. Risk-off often accompanies rate cut expectations (falling real rates) which amplify gold\'s move. Central bank buying supports sustained stress.'],
      ['VIX spikes','Investors panic-buy "put options" — contracts that pay off if the market crashes. This panic buying drives the price of that insurance (VIX) sharply higher, very fast.','VIX spikes often lead equity selloffs. Convexity: VIX rises non-linearly (vol of vol rises). Above 30 = serious fear. Above 40 = crisis regime. VIX short strategies blow up violently in risk-off. VIX reached 85 in COVID March 2020.'],
    ]]].map(([col,label,intro,items])=>(<div key={label} style={{marginBottom:16}}>
      <div style={{fontSize:11,fontWeight:700,color:col,letterSpacing:'0.1em',margin:'0 0 8px'}}>{label}</div>
      <div style={{fontSize:13,color:C.text,lineHeight:1.6,marginBottom:10,padding:'10px 14px',background:`${col}0A`,border:`1px solid ${col}22`,borderRadius:6}}>{intro}</div>
      {items.map(([title,plain,tech])=>(<div key={title} style={{background:C.card,border:`1px solid ${C.border}`,borderLeft:`3px solid ${col}`,borderRadius:6,padding:'12px 14px',marginBottom:7}}>
        <div style={{fontSize:13,fontWeight:600,color:col,marginBottom:6}}>{title}</div>
        <PE col={col}>{plain}</PE>
        <TE>{tech}</TE>
      </div>))}
    </div>))}
  </div>;
}

function MacroSection(){
  const[tab,setTab]=useState('cycle');
  const PE=({col,children})=>(<div style={{fontSize:13,color:C.text,lineHeight:1.7,background:`${col||C.accent}0E`,borderRadius:6,padding:'10px 14px',marginBottom:6,borderLeft:`2px solid ${col||C.accent}50`}}><span style={{fontSize:10,fontWeight:600,color:col||C.accent,letterSpacing:'0.07em',marginRight:8,opacity:0.9}}>Plain English</span>{children}</div>);
  const TE=({children})=>(<div style={{fontSize:12,color:C.muted,lineHeight:1.7,background:'rgba(255,255,255,0.03)',borderRadius:6,padding:'10px 14px',borderLeft:`2px solid ${C.border}`}}><span style={{fontSize:10,fontWeight:600,color:C.dim,letterSpacing:'0.07em',marginRight:8}}>Technical</span>{children}</div>);
  return <div>
    <SH>Macro Framework</SH>
    <p style={{fontSize:13,color:C.muted,marginBottom:20}}>The engine that drives every asset class — every term explained</p>
    <TabBar tabs={[{id:'cycle',label:'Economic Cycle'},{id:'data',label:'Key Data'},{id:'fed',label:'The Fed'},{id:'curve',label:'Yield Curve'}]} active={tab} set={setTab}/>
    {tab==='cycle'&&<>
      <Card accent={C.dim}><P><strong style={{color:C.text}}>What is the economic cycle?</strong> Economies don't grow in a straight line — they expand, peak, contract, then recover, over and over. Where you are in this cycle determines almost everything: which assets perform, what the Fed does, and what your clients care about. Think of it like seasons — you dress differently in summer vs. winter.</P></Card>
      {[['Expansion',C.green,'The economy is growing faster than normal. Companies are hiring, profits are rising, consumers are spending. This is the "summer" — things are good and getting better.',['GDP growing above its long-run average (typically 2%)','Unemployment falling as companies hire','Corporate earnings rising — beat & raise season','Credit spreads tightening — lenders are confident'],'Risk-on. Cyclicals (energy, industrials, financials), high yield credit, equities broadly. Avoid long bonds — inflation risk builds.','GDP above potential (output gap > 0), labor market tightening (NAIRU approaching), earnings in upgrade cycle. Risk assets bid. Credit cycle positive — defaults low, credit creation accelerating. Leading indicators: rising ISM New Orders, positive yield curve slope.'],
      ['Peak',C.amber,'Growth is still positive but we\'ve hit the top. Inflation is high and the Fed is aggressively hiking rates to cool it down. The economy is at "maximum heat" — about to turn.',['Inflation elevated and still rising','Central bank hiking rates fast','Yield curve flattening (short rates rising faster than long)','Labor market at maximum tightness'],'Defensives (staples, healthcare), commodities (inflation protection), short-duration bonds. Trim equities — multiple compression risk high.','Output gap at maximum, labor market above full employment, inflation expectations deanchoring. Fed hiking into tightening financial conditions. Yield curve flattening as hikes price in. Earnings per share still strong but guidance risk rising. 2022 was the quintessential Peak.'],
      ['Contraction',C.red,'The economy is slowing or shrinking. Companies are cutting jobs, consumers are pulling back, profits are falling. This is the "winter" — things are bad and getting worse. Could be a mild slowdown or a full recession.',['GDP slowing or negative (recession)','Unemployment rising as companies lay off','Corporate earnings falling','Credit spreads widening — lenders worried about defaults'],'Safe assets dominate: US Treasuries, USD, gold, defensive equities (staples, utilities). Avoid HY credit, cyclicals, EM.','Output gap negative, unemployment above NAIRU, earnings in downgrade cycle. Default risk rising → HY spreads blow out. Fed cuts rates to stimulate. Treasury rallies as flight to safety. Leading indicators: inverted yield curve, ISM below 50, building permits falling.'],
      ['Recovery',C.cyan,'The worst is over. The economy is picking up off the bottom. The Fed has cut rates, stimulus is kicking in, and the first green shoots are appearing. This is the transition from winter back to spring.',['Leading indicators (ISM New Orders, permits) bottoming and turning up','Fed pivoting dovish — cutting rates or signaling cuts','Credit starting to ease — banks willing to lend again','Unemployment still high but stabilizing'],'Equities lead (especially growth — they benefit most from rate cuts), emerging markets, HY credit (first to price recovery). Rates: steepen the curve (short end falls faster with cuts).','GDP below potential but growth accelerating from trough. Fed at or near peak cutting cycle. Credit cycle bottoming — default rates peak, recovery values being priced. Leading indicators turning: yield curve re-steepening, ISM New Orders > 50, building permits inflecting. 2009 and 2020 (Apr) were classic Recoveries.'],
      ].map(([phase,col,plain,signals,assets,tech])=>(<Card key={phase} accent={col}><div style={{fontSize:13,fontWeight:700,color:col,marginBottom:8}}>{phase}</div><PE col={col}>{plain}</PE><div style={{marginBottom:8}}>{signals.map(s=><div key={s} style={{fontSize:12,color:C.muted,marginBottom:3,paddingLeft:8,borderLeft:`2px solid ${col}33`}}>· {s}</div>)}</div><div style={{fontSize:12,color:C.text,marginBottom:8,paddingTop:8,borderTop:`1px solid ${C.border}`}}><span style={{color:C.dim,fontWeight:700}}>WHAT WINS: </span>{assets}</div><TE>{tech}</TE></Card>))}
      <Sub>Indicator Types — How to Track the Cycle</Sub>
      <Card accent={C.dim}><P>Economic indicators are clues about where in the cycle we are. The tricky part: some clues appear <em>before</em> the turn, some <em>during</em>, some <em>after</em>. You need to know which is which to stay ahead of the market.</P></Card>
      {[['Leading',C.cyan,'These move BEFORE the economy turns. They\'re your early warning system — if these start flashing red, contraction is coming even if GDP is still positive. Markets watch these obsessively.',['2s10s yield curve slope (inverts before recessions)','ISM New Orders PMI (measures orders flowing in to businesses)','Building permits (construction decisions made months before building)','Consumer confidence surveys'],'Leading indicators have informational content about future states. Yield curve inversion has preceded every US recession with a lag of ~12–18 months. ISM New Orders PMI leads production by ~3 months. These are the inputs to economic forecasting models.'],
      ['Coincident',C.accent,'These move WITH the economy in real time. They\'re the "current score" — telling you what\'s happening right now. GDP is the ultimate coincident indicator.',['GDP — total output, reported quarterly with a lag','Industrial production — factory output','Non-farm payrolls (NFP) — total jobs added','Personal income'],'Coincident indicators define the current regime state. GDP is the anchor but reported with 30–90 day lag. NFP is the highest-frequency coincident indicator (monthly). NBER uses coincident data retrospectively to officially date recessions (often 6–12 months after they begin).'],
      ['Lagging',C.muted,'These confirm the cycle change AFTER it\'s already happened. Useful for verification, but don\'t use them to predict — you\'ll always be too late.',['CPI and PCE — inflation takes time to slow even after rate hikes','Unemployment rate — companies stop hiring before layoffs spike','Corporate profit margins — compress after the economy turns','Bank lending standards'],'Lagging indicators confirm regime change after the fact. Unemployment is the canonical lag — it peaks 6–12 months after recession ends. CPI lags policy by 12–18 months (why "transitory" in 2021 was wrong — it reflected old dynamics). Useful for confirming cycle phase, not predicting transitions.'],
      ].map(([type,col,plain,examples,tech])=>(<Card key={type} accent={col}><div style={{fontSize:13,fontWeight:700,color:col,marginBottom:8}}>{type} Indicators</div><PE col={col}>{plain}</PE><div style={{marginBottom:8}}>{examples.map(e=><div key={e} style={{fontSize:12,color:C.text,marginBottom:3,paddingLeft:8,borderLeft:`2px solid ${col}33`}}>· {e}</div>)}</div><TE>{tech}</TE></Card>))}
    </>}
    {tab==='data'&&<>
      <Card accent={C.dim}><P><strong style={{color:C.text}}>Why does economic data move markets?</strong> Because the Fed uses these numbers to decide whether to raise or cut interest rates. Traders are constantly trying to predict the next data release — and then predict how it changes the Fed's plans — and then trade on that prediction before the market catches up.</P></Card>
      {[{cat:'Labor Market',col:C.green,items:[
        {name:'NFP — Non-Farm Payrolls',freq:'First Friday of every month',plain:'The single most market-moving number in the world. It counts how many jobs the US economy added or lost last month (excluding farm workers). Strong job growth = economy healthy = Fed may raise rates. Weak growth = economy slowing = Fed may cut rates.',tech:'Non-farm payrolls measures net job creation across all private and government sectors except agriculture. Expectation vs. actual is what matters — a 200k print when 150k was expected is "hot." Revisions to prior months are often as important as the headline. Subsectors: private vs. government, goods vs. services. Average hourly earnings (also in the report) tracks wage inflation.',mkt:'Everything — rates, equities, USD, credit. Highest-frequency labor market read.'},
        {name:'JOLTS — Job Openings & Labor Turnover',freq:'Monthly, ~5 weeks after month-end',plain:'Counts how many job openings exist vs. how many people are quitting vs. being fired. When openings are very high, workers have pricing power — they can demand higher wages. High wages = more inflation = Fed needs to keep hiking.',tech:'JOLTS (Job Openings and Labor Turnover Survey) is the Fed\'s preferred measure of labor demand. The quits rate is the most important sub-series — high quits = workers confident they can find better jobs = wage pressure. Current openings ÷ unemployed = ~1.3x (elevated). Fed tracks this in FOMC materials.',mkt:'Short-end rates (2Y UST) most sensitive. High openings → hawkish Fed read.'},
        {name:'Initial Claims',freq:'Every Thursday (for the prior week)',plain:'The closest thing to a real-time economic heartbeat. It counts how many people filed for unemployment benefits last week. Spiking claims mean layoffs are accelerating — a very early recession signal.',tech:'Initial claims are a high-frequency leading indicator of the labor market. 4-week moving average smooths noise. Below 220k = tight. Above 300k = deteriorating. During COVID: 6 million/week. Continuing claims (week 2+) tell you how long people stay unemployed once they file.',mkt:'Front-end rates. Claims spike → dovish Fed read → 2Y falls.'},
      ]},{cat:'Inflation',col:C.red,items:[
        {name:'CPI — Consumer Price Index',freq:'Monthly, ~2 weeks after month-end',plain:'The most famous inflation measure. It tracks what a typical basket of goods costs — groceries, rent, gas, healthcare, clothing. If that basket costs 3% more this year than last year, CPI is 3%. The Fed is supposed to keep this near 2%.',tech:'CPI is calculated by BLS. Headline CPI includes food and energy (volatile). Core CPI strips those out — more persistent. Shelter (OER — Owners\' Equivalent Rent) is ~42% of core CPI and lags actual rents by ~12 months. Super-core = services ex-housing = Fed\'s most watched component. Currently: Headline ~3.5%, Core ~3.2%.',mkt:'2Y yields and USD respond most. Hot CPI print → rates up, USD up, equities down.'},
        {name:'PCE — Personal Consumption Expenditures',freq:'Monthly, ~4 weeks after month-end',plain:'This is the Fed\'s preferred inflation measure (CPI is more famous but PCE is what they actually target at 2%). PCE captures more of what people actually buy — including things like healthcare costs paid by your employer. It tends to run slightly below CPI.',tech:'PCE is broader than CPI: includes goods and services purchased on behalf of households (e.g., employer-paid healthcare). Chain-weighted (adjusts for substitution). Core PCE is the Fed\'s official 2% target. Currently: Core PCE ~3.3%, above target. SEP (dot plot) projects are PCE-based.',mkt:'The most Fed-critical release. Hot PCE → more hikes on the table.'},
        {name:'PPI — Producer Price Index',freq:'Monthly, 1 week before CPI',plain:'PPI measures inflation from the producer\'s side — how much more are factories paying for raw materials and selling finished goods for? It\'s an upstream inflation signal — if producers are paying more, they\'ll eventually pass those costs to consumers through CPI.',tech:'PPI measures price changes from the seller\'s perspective. Components: final demand goods/services + intermediate demand (upstream). PPI leads CPI by ~3–6 months. PPI ex-food, energy, and trade services → direct input to PCE healthcare component. A key CPI forecasting input.',mkt:'CPI expectations. Hot PPI → next CPI likely to be hot.'},
      ]},{cat:'Growth',col:C.accent,items:[
        {name:'GDP — Gross Domestic Product',freq:'Quarterly (3 releases: advance, second, final)',plain:'GDP is the total value of everything the US economy produces in a quarter. Think of it as the economy\'s report card. Two negative quarters in a row = recession (official definition). Positive and above-trend GDP = expansion. US GDP is ~$28 trillion per year.',tech:'GDP = C + I + G + (X-M). C = consumer spending (70% of US GDP), I = investment, G = government, X-M = net exports. The advance estimate is most market-moving (released ~30 days after quarter ends). GDP deflator (price component) is watched for inflation content. GDPNow (Atlanta Fed) provides real-time tracking estimate.',mkt:'Everything — but reported with a lag, so markets often anticipate GDP via higher-frequency indicators (PMIs, payrolls).'},
        {name:'ISM PMI — Manufacturing & Services',freq:'First business day of every month',plain:'PMI = Purchasing Managers\' Index. It surveys the people who actually buy stuff for factories and businesses: "Are you buying more or less than last month?" Above 50 = expansion. Below 50 = contraction. The New Orders subcomponent is the most forward-looking because today\'s orders = tomorrow\'s production.',tech:'ISM Manufacturing PMI: surveys 400 purchasing managers across 18 industries. New Orders is the leading component (2–3 month lead). ISM Services PMI covers 70%+ of US GDP. The composite PMI from S&P Global (formerly IHS Markit) is also important. PMIs are diffusion indices — 50 = half up/half down, so above 50 = net expansion.',mkt:'Rates (duration), equities, USD. Services PMI especially important given US is a service-dominant economy.'},
        {name:'Retail Sales',freq:'Monthly, ~2 weeks after month-end',plain:'Tracks how much Americans spent at stores, restaurants, and online last month. Since consumer spending is 70% of GDP, this is the closest real-time read on economic health. Big beat = economy strong = Fed stays hawkish.',tech:'Retail sales covers goods spending (~40% of total consumer spending; services not included). Control group (ex-autos, gas, building materials, food services) feeds directly into GDP calculation. Month-over-month changes are noisy; markets focus on the trend and revisions. Online retail (Amazon effect) has changed seasonal patterns.',mkt:'Consumer equities (XRT), USD, front-end rates.'},
      ]}].map(({cat,col,items})=><div key={cat}><Sub><span style={{color:col}}>{cat}</span></Sub>{items.map(r=><Card key={r.name} accent={col}><div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:8}}><span style={{fontSize:13,fontWeight:700,color:C.text}}>{r.name}</span><span style={{fontSize:11,color:C.muted,fontFamily:'monospace'}}>{r.freq}</span></div><PE col={col}>{r.plain}</PE><TE>{r.tech}</TE><div style={{fontSize:11,marginTop:6}}><span style={{color:C.dim,fontWeight:700}}>MARKETS AFFECTED: </span><span style={{color:col}}>{r.mkt}</span></div></Card>)}</div>)}
    </>}
    {tab==='fed'&&<>
      <Card accent={C.amber}><P><strong style={{color:C.text}}>What is the Federal Reserve?</strong> The Fed is the US central bank — a semi-independent government institution that controls the money supply and interest rates. Its two main jobs: keep inflation near 2% and keep unemployment low (the "dual mandate"). How it achieves this is through tools that every S&T professional needs to understand cold.</P><P><strong style={{color:C.text}}>Current situation (Sept 2026):</strong> Kevin Warsh replaced Jerome Powell as Chair in May 2026. More hawkish, explicitly anti-forward-guidance. Hiked 25bps to 3.75–4.00% on Sept 16. Markets pricing further hikes. Core PCE at 3.3%+. Oil $100+ from Strait of Hormuz adding to inflation.</P></Card>
      <Sub>The Fed's Tools</Sub>
      {[{tool:'Federal Funds Rate (FFR)',type:'Primary Rate',col:C.amber,plain:'The most important interest rate in the world. It\'s the overnight rate banks charge each other to borrow money. Everything else — your mortgage, corporate bonds, credit cards — is priced relative to this. When the Fed "hikes," it raises this rate. Higher FFR = more expensive to borrow = less spending = less inflation.',tech:'FFR is the target rate for overnight interbank lending in the federal funds market. Fed sets a target range (currently 3.75–4.00%). Fed controls it via Open Market Operations (buying/selling Treasuries) through the Desk at FRBNY. Also pays IORB (Interest on Reserve Balances) and sets RRP (Reverse Repo) rate as the floor. FFR anchors the entire short end of the yield curve.',effect:'When FFR rises → 2Y Treasury yield rises → mortgage rates rise → auto loan rates rise → corporate bond rates rise → borrowing becomes expensive → spending slows → inflation falls.'},
      {tool:'QE — Quantitative Easing',type:'Balance Sheet',col:C.cyan,plain:'QE is when the Fed creates new money and uses it to buy government bonds (Treasuries) and mortgage-backed securities. This is like injecting cash directly into the financial system. Why? To lower long-term interest rates and encourage borrowing and investment when cutting the FFR to zero isn\'t enough. Used massively in 2008, 2020.',tech:'QE works by expanding the Fed\'s balance sheet. The Fed buys Treasuries/MBS from banks → banks receive reserves → lower yields on bought securities → portfolio rebalancing into riskier assets (pushing up equities, credit). Mechanism: asset prices rise, interest rates fall, wealth effect, currency weakens. Fed peak balance sheet: ~$9T in 2022.',effect:'QE → long rates fall → all asset prices rise (2020–2021 everything rally) → USD weakens → inflation risk rises.'},
      {tool:'QT — Quantitative Tightening',type:'Balance Sheet',col:C.red,plain:'QT is the opposite of QE — the Fed lets its bonds mature without reinvesting the proceeds, or actively sells them. This shrinks the money supply, puts upward pressure on long-term rates, and tightens financial conditions. Currently ongoing.',tech:'QT reduces reserves in the banking system. The Fed is allowing up to $60B/month in Treasuries and $35B/month in MBS to roll off. Unlike rate hikes (which work through the short end), QT primarily affects term premia (the extra yield investors demand for longer maturities). Fed balance sheet: ~$7T currently. QT runs until reserves hit "ample" level.',effect:'QT → long rates rise → financial conditions tighten → credit more expensive → slowdown pressure.'},
      {tool:'Forward Guidance',type:'Communication',col:C.purple,plain:'This is when the Fed tells markets what it plans to do in the future — "we expect to hold rates here for an extended period" or "we don\'t expect to cut this year." This allows markets to price in future policy without waiting for actual moves. Warsh has explicitly rejected this approach, causing much more uncertainty (and volatility) in rates.',tech:'Forward guidance shifts the yield curve via expectations channel — if the Fed signals higher for longer, 2Y yields rise even without actual hikes (markets pricing expected path). Under Powell: heavy use of forward guidance, detailed SEP projections. Under Warsh: data-dependent, no pre-commitment. Result: higher rate vol (MOVE index elevated), markets must price each meeting individually without guidance.',effect:'Forward guidance → anchors market rate expectations → reduces vol. Absence of guidance (Warsh) → higher rate vol → uncertainty premium in longer-dated yields.'},
      ].map(t=>(<Card key={t.tool}><div style={{display:'flex',gap:8,alignItems:'baseline',marginBottom:8}}><span style={{fontSize:13,fontWeight:700,color:C.text}}>{t.tool}</span><Tag color={t.col}>{t.type}</Tag></div><PE col={t.col}>{t.plain}</PE><TE>{t.tech}</TE><div style={{fontSize:11,color:t.col,marginTop:6,fontWeight:600}}>Effect: {t.effect}</div></Card>))}
      <Sub>Key Vocabulary — Fed Speak Decoded</Sub>
      {[['Hawkish',C.red,'Bias toward hiking rates (or keeping them high). "Hawkish" because hawks are aggressive.','Policy stance where the primary concern is inflation control, even at the cost of growth. Hawkish signals: upward dot plot revisions, emphasis on inflation risks in FOMC minutes, resistance to acknowledging progress on inflation. Warsh is the most hawkish chair since Volcker.'],
      ['Dovish',C.green,'Bias toward cutting rates (or keeping them low) to support growth and jobs. Doves are gentle.','Policy stance prioritizing employment and growth over inflation control. Dovish signals: downward dot plot revisions, language acknowledging downside risks to growth, willingness to tolerate above-target inflation temporarily. Powell 2020–2023 was dovish.'],
      ['Dot Plot',C.cyan,'A chart released 4x per year showing where each of the 19 FOMC members thinks rates will be. Each member\'s projection is a "dot." Markets move significantly when the dots shift.','The FOMC Summary of Economic Projections (SEP) contains the dot plot — each member\'s year-end FFR projection for the next 3 years plus the longer-run rate. Markets derive the implied rate path. Hawkish surprise = dots shift higher → 2Y and 5Y yields rise.'],
      ['Terminal Rate',C.amber,'The peak rate in a hiking cycle — the highest point before the Fed stops hiking. In 2022–2023, the terminal rate was 5.25–5.50%. In this cycle, markets are pricing ~4.50–4.75%.','Terminal rate is where the hiking cycle ends. Implied by fed funds futures strip — typically markets price it 6–18 months out. Terminal rate determines how long the yield curve stays inverted or flat. Higher terminal = more duration pressure on long bonds.'],
      ['r* (Neutral Rate)',C.purple,'The Goldilocks interest rate — not too hot (stimulative), not too cold (restrictive). Fed estimates it at ~2.5–3%. When FFR is above r*, policy is restrictive. When below, it\'s accommodative.','r* (r-star) is the real neutral rate — where policy neither stimulates nor contracts. Unobservable, estimated from economic models (Laubach-Williams). Fed currently has FFR well above r* (3.75–4.00% nominal vs. r* ~2.5–3% + PCE 3.3% = real FFR is negative). Fed uses r* to assess how tight policy actually is.'],
      ['Pivot',C.green,'When the Fed shifts direction — stops hiking and starts cutting, or vice versa. Markets always try to predict and trade ahead of pivots, often months in advance.','The pivot is the inflection in the rate path. Bull case: data weakens, inflation falls → Fed signals cut path → front end rallies → curve steepens. Bear case: inflation stays sticky → higher terminal → inversion persists. Markets typically front-run pivots by 3–6 months, embedding them in fed funds futures.'],
      ['PCE vs. CPI Target',C.amber,'The Fed\'s official inflation target is 2% measured by PCE (not CPI). This matters because PCE and CPI can diverge by 30–50bps due to how they\'re constructed.','PCE is the official Fed target due to its broader scope and chain-weighting (substitution bias correction). Core PCE averages ~40–50bps below core CPI structurally. This means 2% PCE target ≈ ~2.5% CPI. Current Core PCE: 3.3% = 130bps above target. Gap explains continued hawkish bias.'],
      ['Higher for Longer',C.red,'Even after inflation starts falling, the Fed keeps rates high for a long time to make sure inflation is truly dead. Markets hate this because everyone was hoping for quick cuts.','HFL thesis: structural inflation drivers (tight labor, fiscal deficit, energy transition) keep inflation above 2% target for years → r* has risen → Fed must keep FFR elevated longer → yield curve stays flat or inverted longer → financial conditions remain tight. Supports: term premium re-pricing, real rate normalization, fiscal drag reduced.'],
      ].map(([term,col,plain,tech])=>(<Card key={term}><div style={{fontSize:13,fontWeight:700,color:col,marginBottom:8}}>{term}</div><PE col={col}>{plain}</PE><TE>{tech}</TE></Card>))}
    </>}
    {tab==='curve'&&<>
      <Card accent={C.accent}><PE col={C.accent}><strong>What is the yield curve?</strong> Imagine lending money to your friend for 1 day vs. 30 years. You'd charge a lot more for 30 years — more risk, more uncertainty. The yield curve charts exactly that: how much interest the US government pays to borrow money for different time periods, from 1 month out to 30 years. The shape of this curve tells you what markets think about growth, inflation, and Fed policy.</PE><TE>The yield curve plots US Treasury yields (y-axis) vs. maturity (x-axis: 1M, 3M, 6M, 1Y, 2Y, 5Y, 10Y, 30Y). The 2Y yield reflects short-term Fed expectations. The 10Y yield reflects longer-term growth + inflation + term premium. The spread (10Y - 2Y = "2s10s") is the most watched metric. Curve inversions (short > long) have preceded all 8 US recessions in the past 50 years.</TE></Card>
      <Sub>Shapes — What Each Means</Sub>
      {[['Normal / Upward Sloping',C.green,'Long rates > short rates. This is the default healthy state. Higher rates for longer maturities because investors demand more compensation for tying up money for longer and for uncertainty about future inflation.','Positive term premium. Long rate = expected future short rates + term premium. Healthy growth outlook. Suggests economy growing at or above trend, Fed policy roughly neutral. 2s10s > 0. Classic S-curve with largest spread around 2–5Y.'],
      ['Inverted',C.red,'Short rates > long rates. Unusual and alarming — it means investors think rates will be LOWER in the future than they are today. Why? Because they expect a recession that will force the Fed to cut. The 2022–2023 inversion was the most severe in 40 years (2s10s = -100bps).','Inversion occurs when market-implied path of future short rates falls below current short rate. Signals: (1) market pricing significant future rate cuts (recession expectation), (2) flight to safety bid pushing long yields down, (3) tight Fed creating short-run scarcity premium. 2s10s inverted July 2022, persisted ~22 months, deepest point -107bps.'],
      ['Bear Steepener',C.amber,'Long rates rise faster than short rates — curve steepens for bad reasons. "Bear" because rising yields hurt bond prices. This happens when inflation fears or fiscal concerns are pushing up long-term borrowing costs even as the short end stays anchored. The 2026 theme.','Bear steepener: 10Y - 2Y spread widens because 10Y rises more than 2Y. Driven by: rising inflation expectations (breakevens), term premium expansion (fiscal deficit concern), or loss of confidence in long-run policy credibility. 2026 bear steepener driven by Warsh + oil shock + fiscal concerns. Bad for fixed income total return.'],
      ['Flat',C.muted,'Short and long rates are roughly equal. Often seen as a transition — either about to invert (if flattening further) or about to steepen (if the cycle is turning). Late-cycle signal when flattening from normal.','Flat curve: 2s10s near 0. Typical at cycle peaks — Fed has hiked short end while long end hasn\'t moved much (growth/inflation priced out longer-term). Net interest margin (NIM) compression for banks. Transition state: precursor to inversion (if Fed continues hiking) or re-steepening (if Fed signals pause/cut).'],
      ].map(([shape,col,plain,tech])=>(<Card key={shape} accent={col}><div style={{fontSize:13,fontWeight:700,color:col,marginBottom:8}}>{shape}</div><PE col={col}>{plain}</PE><TE>{tech}</TE></Card>))}
      <Sub>Movement Vocabulary</Sub>
      <Card accent={C.dim}><P>When traders talk about yield curve moves, they describe them in two dimensions: <strong style={{color:C.text}}>direction</strong> (bull = yields falling / prices rising; bear = yields rising / prices falling) and <strong style={{color:C.text}}>shape</strong> (flattener = curve gets flatter; steepener = curve gets steeper).</P></Card>
      {[['Bull Flattener',C.green,'Short-end yields fall faster than long-end. Usually means: markets expect big Fed cuts soon. The "front end rallies" but long end is less excited.','"Bull" = prices rising (yields falling). Flattener = curve getting flatter (2s10s spread shrinking). Front end leads because it\'s most sensitive to near-term Fed expectations. Classic signal: recession imminent, Fed about to pivot. 2s10s spread narrows because 2Y falls more than 10Y.'],
      ['Bear Flattener',C.red,'Short-end yields rise faster than long-end. Fed is hiking hard and markets think it will eventually cause a recession that forces cuts — so long end doesn\'t rise as much.','Bear = prices falling (yields rising). Flattener = 2s10s narrowing. Happens when Fed is hiking into a slowdown. Short end anchored higher by hike path, long end constrained by eventual recession expectation. Typical late-cycle pattern — precursor to inversion. 2022 pattern.'],
      ['Bull Steepener',C.cyan,'Long-end yields fall faster than short-end. Markets are saying: we think growth/inflation longer-term is going to be lower than the short end implies. Often early recovery when Fed cuts start.','"Bull" because prices rising (yields falling). "Steepener" because the curve is getting steeper (2s10s widening). Fed cutting → front end falls → long end stickier (inflation/fiscal concerns keep it up). Typical early recovery pattern.'],
      ['Bear Steepener',C.amber,'Long-end yields rise faster than short-end. The bad kind of steepening — driven by inflation fears, fiscal concerns, or loss of confidence in long-term price stability. THE 2026 theme.','Bear steepener = 2s10s widens because 10Y rises more than 2Y. Worst for fixed income: prices falling AND duration exposure increasing. Driven by: term premium rising (fiscal concerns, QT), inflation expectations re-anchoring higher, or foreign buyers reducing Treasury demand. 2026 characterized by this pattern.'],
      ['Parallel Shift',C.muted,'All maturities move up or down by roughly the same amount simultaneously. Often happens in big macro surprise events (CPI shock, emergency Fed action).','Parallel shift affects all maturities equally — duration/convexity fully realized. DV01 (dollar value of a basis point) times the shift = total P&L impact. Less common than curve shape changes because near-term Fed expectations and long-run inflation/growth expectations often move differently.'],
      ].map(([term,col,plain,tech])=>(<Card key={term} accent={col}><div style={{fontSize:13,fontWeight:700,color:col,marginBottom:8}}>{term}</div><PE col={col}>{plain}</PE><TE>{tech}</TE></Card>))}
      <Sub>Key Metrics Traders Quote</Sub>
      {[['2s10s (Two-tens spread)','The most-quoted spread: 10Y yield minus 2Y yield. Currently: slightly positive after the bear steepener of 2026. Positive = normal. Negative = inverted = recession signal.','2s10s = DGS10 - DGS2 (FRED codes). The canonical term structure spread. Regression: negative 2s10s predicts recession with ~12–18M lag. Each inversion has been followed by recession. Probit models: deep inversion = high recession probability. Currently bear steepening: both rising but 10Y faster.'],
      ['DV01 (Dollar Value of 01)','How much money you make or lose if yields move by 1 basis point (0.01%). A bond with DV01 = $10,000 means every 1bp move = $10k profit/loss. This is how traders size positions.','DV01 = -Modified Duration × Price × Face Value × 0.0001. The primary risk metric for fixed income positions. A Treasury portfolio manager running $100M face value of 10Y Treasuries (duration ~9yr) has DV01 ≈ $90,000/bp. Hedging with futures: DV01 of futures position must match DV01 of underlying exposure.'],
      ['Duration','Measures how much a bond\'s price changes when interest rates move. A 10Y Treasury has duration ~9 years — meaning its price falls ~9% if rates rise 1%. Higher duration = more sensitive to rates.','Modified Duration = Macaulay Duration / (1 + YTM). Price change % ≈ -Modified Duration × Δyield. A 30Y bond has duration ~18–20yr vs. 2Y ~1.8yr. Why 2022 was catastrophic for pension funds/insurance companies: 4% hike × 20yr duration = ~80% price impact on long bonds. Duration IS the core risk in fixed income.'],
      ].map(([term,plain,tech])=>(<Card key={term}><div style={{fontSize:13,fontWeight:700,color:C.cyan,marginBottom:8}}>{term}</div><PE col={C.cyan}>{plain}</PE><TE>{tech}</TE></Card>))}
    </>}
  </div>;
}

function AssetsSection(){
  const[tab,setTab]=useState('equities');
  const PE=({col,children})=>(<div style={{fontSize:13,color:C.text,lineHeight:1.7,background:`${col||C.accent}0E`,borderRadius:6,padding:'10px 14px',marginBottom:6,borderLeft:`2px solid ${col||C.accent}50`}}><span style={{fontSize:10,fontWeight:600,color:col||C.accent,letterSpacing:'0.07em',marginRight:8,opacity:0.9}}>Plain English</span>{children}</div>);
  const TE=({children})=>(<div style={{fontSize:12,color:C.muted,lineHeight:1.7,background:'rgba(255,255,255,0.03)',borderRadius:6,padding:'10px 14px',borderLeft:`2px solid ${C.border}`}}><span style={{fontSize:10,fontWeight:600,color:C.dim,letterSpacing:'0.07em',marginRight:8}}>Technical</span>{children}</div>);
  return <div>
    <SH>Asset Classes</SH>
    <p style={{fontSize:13,color:C.muted,marginBottom:20}}>The instruments you'll price and sell — explained from scratch</p>
